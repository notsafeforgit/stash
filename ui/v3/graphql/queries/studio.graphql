query FindStudios($filter: FindFilterType, $studio_filter_ast: FilterASTInput) {
  findStudios(filter: $filter, studio_filter_ast: $studio_filter_ast) {
    count
    studios {
      ...StudioData
    }
  }
}

query FindStudio($id: ID!) {
  findStudio(id: $id) {
    ...StudioData
  }
}

query FindStudiosForSelect(
  $filter: FindFilterType
  $studio_filter_ast: FilterASTInput
  $ids: [ID!]
) {
  findStudios(
    filter: $filter
    studio_filter_ast: $studio_filter_ast
    ids: $ids
  ) {
    count
    studios {
      ...SelectStudioData
    }
  }
}
