  - electron-to-chromium@1.5.433
  - eslint@10.11.0
  - intl-messageformat@12.1.1
  - lru-cache@11.5.3
  - react-intl@12.1.1
  - rollup@4.63.4
  - systeminformation@5.33.12
  - regjsparser@0.13.3
  - which-typed-array@1.1.24

# The 10.0.1 adapter still pins hls.js 1.6.7. Retain the current stable engine,
# including its Safari ManagedMediaSource seek and end-of-stream fixes.
overrides:
  "@videojs/hlsjs-video@10.0.1>hls.js": 1.7.3
  "unplugin>esbuild": ^0.28.1
  "tsx>esbuild": ^0.28.1

# Keep touch-generated combobox clicks in WebKit; mousedown still retains focus.
# Recheck entity-list-filters.browser.ts before removing this on an upgrade.
patchedDependencies:
  '@base-ui/react@1.8.0': patches/@base-ui__react@1.8.0.patch
