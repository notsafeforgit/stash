name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - develop
      - v3-rewrite
  workflow_dispatch:
    inputs:
      preserve_compatible_release:
        description: Preserve the frozen final v2.5-compatible images without rebuilding
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}-ghcr-${{ inputs.preserve_compatible_release && 'preserve-compat' || 'publish' }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ !inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: ui/v3/package.json
    - uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Set lower case owner name
      id: repository_owner
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
        if [ "$GITHUB_REF_NAME" = "v3-rewrite" ]; then
          echo "branch=native-preview" >> $GITHUB_OUTPUT
        else
          echo "branch=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
        fi
        echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Install UI dependencies
      run: make pre-ui pre-ui-v3

    - name: Generate
      run: make generate

    # Go validation inspects embedded UI chunks, so build the bundles first.
    - name: Build UI
      run: make ui ui-v3-only

    - name: Validate fork before publishing
      run: make validate-fork

    - name: Compile linux amd64
      env:
        OFFICIAL_BUILD: 'false'
      run: make build-cc-linux

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/ghcr/Dockerfile
        push: true
        pull: true
        platforms: linux/amd64
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
        tags: |
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}-${{ steps.repository_owner.outputs.short_sha }}

  preserve-compatible-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Install registry copy tool
      run: sudo apt-get update && sudo apt-get install -y skopeo
    - name: Check preservation invariants
      run: python3 -m unittest discover -s scripts -p test_preserve_compatible_images.py
    - name: Authenticate registry tools
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        printf '%s' "$GHCR_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
    - name: Preserve compatible image manifests
      env:
        REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
      run: |
        python3 scripts/preserve_compatible_images.py \
          --manifest docs/releases/v2.5-compatible-final.json \
          --repository ghcr.io/notsafeforgit/stash \
          --receipt compatible-release-receipt.json
    - uses: actions/upload-artifact@v4
      with:
        name: compatible-stash-release-receipt
        path: compatible-release-receipt.json
        if-no-files-found: error

  cleanup-images:
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RETENTION_DAYS: 14

    steps:
    - name: Delete expired branch build tags
      uses: actions/github-script@v8
      with:
        script: |
          const owner = context.repo.owner;
          const packageName = "stash";
          const ownerType = context.payload.repository.owner.type;
          const retentionDays = Number(process.env.RETENTION_DAYS ?? "14");
          const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
          const branchBuildTagPattern = /^(develop|v3-rewrite|native-preview)-[0-9a-f]{7,}$/i;

          const listPackageVersions =
            ownerType === "Organization"
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

          const listPackageVersionParams =
            ownerType === "Organization"
              ? {
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                }
              : {
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                };

          const deletePackageVersion =
            ownerType === "Organization"
              ? (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForOrg({
                    org: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  })
              : (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  });

          const versions = await github.paginate(
            listPackageVersions,
            listPackageVersionParams
          );

          const versionsToDelete = versions.filter((version) => {
            const tags = version.metadata?.container?.tags ?? [];
            if (tags.length === 0) {
              return false;
            }

            const updatedAt = version.updated_at ?? version.created_at;
            if (!updatedAt) {
              return false;
            }

            const isExpired = Date.parse(updatedAt) < cutoff;
            const hasOnlyBranchBuildTags = tags.every((tag) =>
              branchBuildTagPattern.test(tag)
            );

            return isExpired && hasOnlyBranchBuildTags;
          });

          if (versionsToDelete.length === 0) {
            core.info(
              `No expired branch build ${packageName} image versions found.`
            );
            return;
          }

          for (const version of versionsToDelete) {
            const tags = version.metadata?.container?.tags ?? [];
            core.info(
              `Deleting tagged [${tags.join(", ")}] ${packageName} image version ${version.id}`
            );
            await deletePackageVersion(version.id);
          }

          core.info(
            `Deleted ${versionsToDelete.length} ${packageName} image version(s).`
          );
