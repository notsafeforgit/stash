fragment TvSceneSummary on Scene {
  id
  title
  paths {
    screenshot
  }
  preview_image {
    ...PreviewImageData
  }
}

fragment TvMarkerSummary on SceneMarker {
  id
  title
  seconds
  end_seconds
  screenshot
  preview_image {
    ...PreviewImageData
  }
  scene {
    id
  }
}

query TvScenes($filter: FindFilterType, $scene_filter_ast: FilterASTInput) {
  findScenes(filter: $filter, scene_filter_ast: $scene_filter_ast) {
    count
    scenes {
      ...TvSceneSummary
    }
  }
}

query TvMarkers(
  $filter: FindFilterType
  $scene_marker_filter_ast: FilterASTInput
) {
  findSceneMarkers(
    filter: $filter
    scene_marker_filter_ast: $scene_marker_filter_ast
  ) {
    count
    scene_markers {
      ...TvMarkerSummary
    }
  }
}

query TvMarkerFeed(
  $filter: FindFilterType
  $marker_filter_ast: FilterASTInput
  $scene_filter: TVSceneFilterInput!
) {
  findTVMarkerFeed(
    filter: $filter
    marker_filter_ast: $marker_filter_ast
    scene_filter: $scene_filter
  ) {
    count
    items {
      scene {
        ...TvSceneSummary
      }
      marker {
        ...TvMarkerSummary
      }
    }
  }
}
