fragment MobileSceneData on Scene {
  preview_image {
    ...PreviewImageData
  }
  id
  title
  date
  details
  rating100
  resume_time

  files {
    id
    path
    duration
    width
    height
    video_codec
    audio_codec
    frame_rate
    bit_rate
    bit_depth
    color_range
    color_space
    color_transfer
    color_primaries
  }

  paths {
    screenshot
    webp
  }

  studio {
    id
    name
    image_path
  }
}
