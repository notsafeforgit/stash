name: Build

on:
  push:
    branches:
      - develop
      - v3-rewrite
      - master
      - 'releases/**'
  pull_request:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Generate code and build UI
  # Runs natively (no Docker) — go generate/gqlgen and node don't need cross-compilers.
  # Produces artifacts (generated Go files + UI build) consumed by test and build jobs.
  generate:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ui/v2.5/package.json

    # ensure pnpm store path exists to fix post setup node.js error
    # https://github.com/actions/setup-node/issues/1137#issuecomment-2508963254
    - name: Ensure pnpm store path exists
      run: |
        PNPM_STORE_PATH="$( pnpm store path --silent )"
        if [ ! -d "$PNPM_STORE_PATH" ]; then
          echo "PNPM store directory does not exist, creating it."
          mkdir -p "$PNPM_STORE_PATH"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        # Match the compiler image and v3 browser workflow.
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: |
          ui/v2.5/pnpm-lock.yaml
          ui/v3/pnpm-lock.yaml

    - name: Install UI dependencies
      run: |
        make pre-ui
        make pre-ui-v3

    - name: Generate
      run: make generate

    - name: Cache UI build
      uses: actions/cache@v5
      id: cache-ui
      with:
        path: |
          ui/v2.5/build
          ui/v3/build
        key: >-
          ${{ runner.os }}-ui-build-${{ hashFiles(
          '.github/workflows/build.yml', 'Makefile', '.npmrc',
          'ui/v2.5/package.json', 'ui/v2.5/pnpm-lock.yaml', 'ui/v2.5/pnpm-workspace.yaml', 'ui/v2.5/.npmrc',
          'ui/v2.5/vite.config.*', 'ui/v2.5/tsconfig*.json', 'ui/v2.5/index.html', 'ui/v2.5/codegen.*',
          'ui/v2.5/graphql/**', 'ui/v2.5/public/**', 'ui/v2.5/src/**',
          'ui/v3/package.json', 'ui/v3/pnpm-lock.yaml', 'ui/v3/pnpm-workspace.yaml', 'ui/v3/.npmrc',
          'ui/v3/vite.config.*', 'ui/v3/tsconfig*.json', 'ui/v3/index.html', 'ui/v3/codegen.*',
          'ui/v3/biome.jsonc', 'ui/v3/components.json', 'ui/v3/scripts/**',
          'ui/v3/public/**', 'ui/v3/src/**', 'ui/v3/graphql/**', 'graphql/**/*.graphql') }}

    - name: Validate v3 and v2.5 compatibility
      run: make validate-ui-v3

    - name: Validate v2.5 UI
      # skip UI validation for pull requests if UI is unchanged
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: |
        make validate-ui

    - name: Build UI
      # skip UI build for pull requests if UI is unchanged (UI was cached)
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: |
        make ui
        make ui-v3-only

    # Bundle generated Go files + UI build for downstream jobs (test + build)
    - name: Upload generated artifacts
      uses: actions/upload-artifact@v7
      with:
        name: generated
        retention-days: 1
        path: |
          internal/api/generated_exec.go
          internal/api/generated_models.go
          ui/v2.5/build/
          ui/v3/build/
          ui/login/locales/

  # Job 2: Integration tests
  # Runs natively (no Docker) — only needs Go + GCC (for CGO/SQLite), both on ubuntu-22.04.
  # Runs in parallel with the build matrix jobs.
  test:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    # Places generated Go files + UI build into the working tree so the build compiles
    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    - name: Test Backend
      run: make it

  # Job 3: Build the active Linux target in parallel with backend tests.
  # Other cross-compilation targets require the updated compiler Dockerfile.
  build:
    needs: generate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        # - platform: windows
        #   make-target: build-cc-windows
        #   artifact-paths: |
        #     dist/stash-win.exe
        #   tag: win
        # - platform: macos
        #   make-target: build-cc-macos
        #   artifact-paths: |
        #     dist/stash-macos
        #     dist/Stash.app.zip
        #   tag: osx
        - platform: linux
          make-target: build-cc-linux
          artifact-paths: |
            dist/stash-linux
          tag: linux
        # - platform: linux-arm64v8
        #   make-target: build-cc-linux-arm64v8
        #   artifact-paths: |
        #     dist/stash-linux-arm64v8
        #   tag: arm
        # - platform: linux-arm32v7
        #   make-target: build-cc-linux-arm32v7
        #   artifact-paths: |
        #     dist/stash-linux-arm32v7
        #   tag: arm
        # - platform: linux-arm32v6
        #   make-target: build-cc-linux-arm32v6
        #   artifact-paths: |
        #     dist/stash-linux-arm32v6
        #   tag: arm
        # - platform: freebsd
        #   make-target: build-cc-freebsd
        #   artifact-paths: |
        #     dist/stash-freebsd
        #   tag: freebsd

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    - name: Cache Go build
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-cache-${{ matrix.platform }}-${{ hashFiles('go.mod', '**/go.sum') }}

    # This fork currently publishes linux/amd64. Use the version in go.mod;
    # the upstream compiler image predates the v3 dependency requirements.
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build (${{ matrix.platform }})
      env:
        OFFICIAL_BUILD: ${{ github.repository == 'stashapp/stash' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'release' && github.ref != 'refs/tags/latest_develop')) }}
        UPDATE_REPO: ${{ github.repository }}
      run: make ${{ matrix.make-target }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.platform }}
        retention-days: 1
        path: ${{ matrix.artifact-paths }}

  # Job 4: Release
  # Waits for both test and build to pass, then collects all platform artifacts
  # into dist/ for checksums, GitHub releases, and multi-arch Docker push.
  release:
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    # Downloads all artifacts (generated + 7 platform builds) into artifacts/ subdirectories
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    # Reassemble platform binaries from matrix job artifacts into a single dist/ directory
    # make sure that artifacts have executable bit set
    # upload-artifact@v4 strips the common path prefix (dist/), so files are at the artifact root
    - name: Collect binaries
      run: |
        mkdir -p dist
        cp artifacts/build-*/* dist/
        chmod +x dist/*

    - name: Zip UI
      run: |
        cd artifacts/generated/ui/v2.5/build && zip -r ../../../../../dist/stash-ui.zip .

    - name: Generate checksums
      run: |
        git describe --tags --exclude latest_develop | tee CHECKSUMS_SHA1
        sha1sum dist/stash-* dist/stash-ui.zip | sed 's/dist\///g' | tee -a CHECKSUMS_SHA1
        echo "STASH_VERSION=$(git describe --tags --exclude latest_develop)" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV

    # - name: Upload Windows binary
    #   # only upload binaries for pull requests
    #   if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
    #   uses: actions/upload-artifact@v7
    #   with:
    #     name: stash-win.exe
    #     path: dist/stash-win.exe

    # - name: Upload macOS binary
    #   # only upload binaries for pull requests
    #   if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
    #   uses: actions/upload-artifact@v7
    #   with:
    #     name: stash-macos
    #     path: dist/stash-macos

    - name: Upload macOS bundle
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: Stash.app.zip
        path: dist/Stash.app.zip

    - name: Upload Linux binary
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-linux
        path: dist/stash-linux

    - name: Upload UI
      # only upload for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-ui.zip
        path: dist/stash-ui.zip

    - name: Update latest_develop tag
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      run: git tag -f latest_develop; git push -f --tags

    - name: Development Release
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      uses: marvinpinto/action-automatic-releases@v1.1.2
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: latest_develop
        title: "${{ env.STASH_VERSION }}: Latest development build"
        files: |
          dist/stash-linux
          dist/stash-ui.zip
          CHECKSUMS_SHA1

    - name: Master release
      # NOTE: this isn't perfect, but should cover most scenarios
      # DON'T create tag names starting with "v" if they are not stable releases
      if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
      uses: WithoutPants/github-release@v2.0.4
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        allow_override: true
        files: |
          dist/stash-linux
          dist/stash-ui.zip
          CHECKSUMS_SHA1
        gzip: false

    - name: Development Docker
      if: ${{ github.repository == 'stashapp/stash' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        docker run --rm --privileged tonistiigi/binfmt
        docker info
        docker buildx create --name builder --use
        docker buildx inspect --bootstrap
        docker buildx ls
        bash ./docker/ci/x86_64/docker_push.sh development

    - name: Release Docker
      # NOTE: this isn't perfect, but should cover most scenarios
      # DON'T create tag names starting with "v" if they are not stable releases
      if: ${{ github.repository == 'stashapp/stash' && github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        docker run --rm --privileged tonistiigi/binfmt
        docker info
        docker buildx create --name builder --use
        docker buildx inspect --bootstrap
        docker buildx ls
        bash ./docker/ci/x86_64/docker_push.sh latest "${{ github.event.release.tag_name }}"
