name: v3 browser tests

on:
  push:
    branches: [v3-rewrite]
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  pull_request:
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
        include:
          - browser: chromium
            os: ubuntu-24.04
            shards: 2
          # Use GStreamer 1.28: Noble's 1.24 media backend can deadlock or
          # crash during HLS EOF seeks, including with a bare video element.
          - browser: webkit
            os: ubuntu-26.04
            shards: 4
          # Each WebKit shard runs one worker so media timing checks do not
          # compete for the same runner. Keep the per-job test count bounded.
          - browser: webkit
            os: ubuntu-26.04
            shard: 3
            shards: 4
          - browser: webkit
            os: ubuntu-26.04
            shard: 4
            shards: 4
    defaults:
      run:
        working-directory: ui/v3
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run test:browser --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: v3-browser-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ui/v3/playwright-report/
            ui/v3/test-results/
          retention-days: 7
