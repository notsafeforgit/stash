services:
  stash:
    # For production, replace the moving tag with the verified release digest.
    image: ghcr.io/notsafeforgit/stash:native-preview
    container_name: stash
    restart: unless-stopped
    ports:
      - "9999:9999"
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      PUID: "1000"
      PGID: "1000"
      STASH_PORT: "9999"
      TZ: Etc/UTC
    volumes:
      - ./config:/config
      - ./data:/data
      - ./metadata:/metadata
      - ./cache:/cache
      - ./blobs:/blobs
      - ./generated:/generated
      # Only needed with INSTALL_PYTHON_REQUIREMENTS=true:
      # - ./pip-install:/pip-install
    # Intel/AMD: uncomment the render device appropriate for your host.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # NVIDIA: configure GPU reservations using the NVIDIA Container Toolkit.
    # Register /data in Settings → Library after setup.
    # Rootless Podman identity/GPU setup: see docs/container.md.
