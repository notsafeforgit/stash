name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - develop
      - v3-rewrite
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-ghcr
  cancel-in-progress: true

env:
  COMPILER_IMAGE: ghcr.io/stashapp/compiler:14

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Pull compiler image
      run: docker pull $COMPILER_IMAGE

    - name: Set lower case owner name
      id: repository_owner
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
        echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Start build container
      run: |
        mkdir -p .go-cache
        docker run -d --name build \
          --mount type=bind,source="$(pwd)",target=/stash,consistency=delegated \
          --mount type=bind,source="$(pwd)/.go-cache",target=/root/.cache/go-build,consistency=delegated \
          --env OFFICIAL_BUILD=false \
          -w /stash $COMPILER_IMAGE tail -f /dev/null

    - name: Pre-install
      run: docker exec -t build /bin/bash -c "make CI=1 pre-ui"

    - name: Generate
      run: docker exec -t build /bin/bash -c "make generate"

    - name: Build UI
      run: docker exec -t build /bin/bash -c "make ui"

    - name: Compile linux amd64
      run: docker exec -t build /bin/bash -c "make build-cc-linux"

    - name: Cleanup build container
      run: docker rm -f -v build

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/ghcr/Dockerfile
        push: true
        pull: true
        platforms: linux/amd64
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
        tags: |
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}-${{ steps.repository_owner.outputs.short_sha }}

  cleanup-images:
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RETENTION_DAYS: 14

    steps:
    - name: Delete expired branch build tags
      uses: actions/github-script@v8
      with:
        script: |
          const owner = context.repo.owner;
          const packageName = "stash";
          const ownerType = context.payload.repository.owner.type;
          const retentionDays = Number(process.env.RETENTION_DAYS ?? "14");
          const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
          const branchBuildTagPattern = /^(develop|v3-rewrite)-[0-9a-f]{7,}$/i;

          const listPackageVersions =
            ownerType === "Organization"
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

          const listPackageVersionParams =
            ownerType === "Organization"
              ? {
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                }
              : {
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                };

          const deletePackageVersion =
            ownerType === "Organization"
              ? (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForOrg({
                    org: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  })
              : (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  });

          const versions = await github.paginate(
            listPackageVersions,
            listPackageVersionParams
          );

          const versionsToDelete = versions.filter((version) => {
            const tags = version.metadata?.container?.tags ?? [];
            if (tags.length === 0) {
              return false;
            }

            const updatedAt = version.updated_at ?? version.created_at;
            if (!updatedAt) {
              return false;
            }

            const isExpired = Date.parse(updatedAt) < cutoff;
            const hasOnlyBranchBuildTags = tags.every((tag) =>
              branchBuildTagPattern.test(tag)
            );

            return isExpired && hasOnlyBranchBuildTags;
          });

          if (versionsToDelete.length === 0) {
            core.info(
              `No expired branch build ${packageName} image versions found.`
            );
            return;
          }

          for (const version of versionsToDelete) {
            const tags = version.metadata?.container?.tags ?? [];
            core.info(
              `Deleting tagged [${tags.join(", ")}] ${packageName} image version ${version.id}`
            );
            await deletePackageVersion(version.id);
          }

          core.info(
            `Deleted ${versionsToDelete.length} ${packageName} image version(s).`
          );
