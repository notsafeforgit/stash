name: v3 browser tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-probe:
    runs-on: macos-15
    timeout-minutes: 7
    defaults:
      run:
        working-directory: ui/v3
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm run check
      - run: node scripts/diagnose-macos-media.mjs
