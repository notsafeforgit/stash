name: v3 browser tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    timeout-minutes: 7
    defaults:
      run:
        working-directory: ui/v3
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm run check
      - run: node scripts/diagnose-macos-media.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-stacks-${{ matrix.os }}
          path: ui/v3/native-stacks/
