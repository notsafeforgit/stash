name: Native validation and Linux build

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      clients: ${{ steps.changes.outputs.clients }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test check selection and publication gate
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Find successfully published baselines
        uses: actions/github-script@v8
        with:
          script: |
            let runs = [];
            try {
              const response = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'ghcr-publish.yml',
                branch: context.payload.pull_request?.base.ref ?? context.ref.replace('refs/heads/', ''),
                event: 'push', status: 'success', per_page: 20,
              });
              runs = response.data.workflow_runs;
            } catch (error) {
              core.warning(`No verified baseline is available; running all checks: ${error.message}`);
            }
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/native-ci-runs.json`, JSON.stringify(runs));
      - name: Select required checks
        id: changes
        run: python3 scripts/ci_changes.py --runs "$RUNNER_TEMP/native-ci-runs.json"

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-go
        with:
          suite: assets
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: make pre-ui
      - name: Validate CI definitions
        run: make validate-ci
      - name: Generate backend bindings
        run: make generate-backend
      - name: Validate and build UI once
        run: make ui-ci
      - uses: actions/upload-artifact@v7
        with:
          name: native-generated
          retention-days: 1
          if-no-files-found: error
          path: |
            internal/api/generated_exec.go
            internal/api/generated_models.go
            ui/v3/build/
            ui/login/locales/

  sqlite-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-go
        with:
          suite: tests-sqlite
      - name: SQLite unit and integration tests
        run: >-
          python3 scripts/ci_sqlite_tests.py
          --shard ${{ matrix.shard }} --shards 4
          --output "$RUNNER_TEMP/sqlite-tests"
      - name: Retain test timings and failure output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/sqlite-tests/
          retention-days: 7
          if-no-files-found: warn

  backend-tests:
    needs: [changes, assets]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-go
        with:
          suite: tests-other
      - uses: actions/download-artifact@v8
        with:
          name: native-generated
      - name: Install media test runtime
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libavif-bin
      - name: Go unit and integration tests
        run: |
          packages="$(python3 scripts/ci_go_packages.py other)"
          make it GO_TEST_PACKAGES="$packages"

  backend-lint:
    needs: [changes, assets]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-go
        with:
          suite: lint
      - uses: actions/download-artifact@v8
        with:
          name: native-generated
      - run: make lint

  clients:
    needs: [changes, assets]
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-go
        with:
          suite: client-contracts
      - uses: actions/download-artifact@v8
        with:
          name: native-generated
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-suffix: clients
          cache-dependency-glob: integration-clients.json
      - name: Install media fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libavif-bin
      - run: make pre-clients test-clients

  binary:
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-go
        with:
          suite: binary
      - uses: actions/download-artifact@v8
        with:
          name: native-generated
      # Frontend-only runs still prove that all three entry points and their
      # compressed route chunks are embedded in the new binary.
      - name: Test embedded UI
        run: go test ./ui
      - name: Compile Linux amd64
        env:
          OFFICIAL_BUILD: 'false'
          UPDATE_REPO: ${{ github.repository }}
        run: make build-cc-linux
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-amd64
          path: dist/stash-linux
          retention-days: 1
          if-no-files-found: error

  gate:
    needs: [changes, assets, sqlite-tests, backend-tests, backend-lint, clients, binary]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every selected check before publication
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py --gate
