name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      refresh_container_dependencies:
        description: Rebuild container dependencies without cached layers
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}-ghcr-publish
  cancel-in-progress: true

jobs:
  # Validation also builds, pushes and smoke-tests this revision's image under
  # its revision tag while the checks run.
  validate:
    uses: ./.github/workflows/native-ci.yml
    with:
      publish: true
      refresh_container_dependencies: ${{ inputs.refresh_container_dependencies || false }}
    permissions:
      contents: read
      actions: read
      packages: write

  # The branch tag moves only after every check and the image smoke test pass.
  promote:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set lower case owner name
      id: repository_owner
      run: |
        {
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          echo "branch=${GITHUB_REF_NAME//\//-}"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Promote verified image
      env:
        DIGEST: ${{ needs.validate.outputs.image_digest }}
        STASH_REPOSITORY: ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash
        STASH_TAG: ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Validation did not report an image digest" >&2; exit 1; }
        docker buildx imagetools create --tag "$STASH_TAG" "$STASH_REPOSITORY@$DIGEST"
        printf 'Verified native runtime: %s\n' "$STASH_REPOSITORY@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Publish downloadable releases from the same validated artifacts as GHCR.
  release-develop:
    needs: [validate, promote]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-amd64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-generated
          path: generated
      - name: Prepare downloadable release
        run: |
          chmod +x dist/stash-linux
          (cd generated/ui/v3/build && zip -r ../../../../dist/stash-ui.zip .)
          git describe --tags --exclude latest_develop | tee CHECKSUMS_SHA1
          sha1sum dist/stash-linux dist/stash-ui.zip | sed 's/dist\///g' | tee -a CHECKSUMS_SHA1
          echo "STASH_VERSION=$(git describe --tags --exclude latest_develop)" >> "$GITHUB_ENV"
      - name: Development Release
        uses: marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0 # v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: latest_develop
          title: '${{ env.STASH_VERSION }}: Latest development build'
          files: |
            dist/stash-linux
            dist/stash-ui.zip
            CHECKSUMS_SHA1

  cleanup-images:
    needs: promote
    if: ${{ needs.promote.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RETENTION_DAYS: 14

    steps:
    - name: Delete expired branch build tags
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const owner = context.repo.owner;
          const packageName = "stash";
          const ownerType = context.payload.repository.owner.type;
          const retentionDays = Number(process.env.RETENTION_DAYS ?? "14");
          const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
          const branchBuildTagPattern = /^(develop|v3-rewrite|native-preview)-[0-9a-f]{7,}$/i;

          const listPackageVersions =
            ownerType === "Organization"
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

          const listPackageVersionParams =
            ownerType === "Organization"
              ? {
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                }
              : {
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                };

          const deletePackageVersion =
            ownerType === "Organization"
              ? (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForOrg({
                    org: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  })
              : (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  });

          const versions = await github.paginate(
            listPackageVersions,
            listPackageVersionParams
          );

          const versionsToDelete = versions.filter((version) => {
            const tags = version.metadata?.container?.tags ?? [];
            if (tags.length === 0) {
              return false;
            }

            const updatedAt = version.updated_at ?? version.created_at;
            if (!updatedAt) {
              return false;
            }

            const isExpired = Date.parse(updatedAt) < cutoff;
            const hasOnlyBranchBuildTags = tags.every((tag) =>
              branchBuildTagPattern.test(tag)
            );

            return isExpired && hasOnlyBranchBuildTags;
          });

          if (versionsToDelete.length === 0) {
            core.info(
              `No expired branch build ${packageName} image versions found.`
            );
            return;
          }

          for (const version of versionsToDelete) {
            const tags = version.metadata?.container?.tags ?? [];
            core.info(
              `Deleting tagged [${tags.join(", ")}] ${packageName} image version ${version.id}`
            );
            await deletePackageVersion(version.id);
          }

          core.info(
            `Deleted ${versionsToDelete.length} ${packageName} image version(s).`
          );
