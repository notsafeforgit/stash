name: Lint (golangci-lint)
on:
  push:
    tags:
      - v*
    branches:
      - master
      - 'releases/**'
  pull_request:

jobs:
  golangci:
    # The native reusable workflow owns lint on these PRs and branch pushes.
    if: ${{ github.event_name != 'pull_request' || !contains(fromJSON('["develop", "v3-rewrite"]'), github.base_ref) }}
    name: lint
    runs-on: ubuntu-latest
    steps:
      # no tags or depth needed for lint
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # generate-backend runs natively (just go generate + touch-ui) — no Docker needed
      - name: Generate Backend
        run: make generate-backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
