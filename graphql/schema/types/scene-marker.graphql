type SceneMarker {
  id: ID! @libraryID(kind: "scene_marker")
  scene: Scene!
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  primary_tag: Tag!
  tags: [Tag!]!
  created_at: Time!
  updated_at: Time!

  "The path to stream this marker"
  stream: String! # Resolver
  "The path to the preview image for this marker"
  preview: String! # Resolver
  "The path to the screenshot image for this marker"
  screenshot: String! # Resolver
}

input SceneMarkerCreateInput {
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID! @libraryID(kind: "scene")
  primary_tag_id: ID! @libraryID(kind: "tag")
  tag_ids: [ID!] @libraryID(kind: "tag")
}

input SceneMarkerUpdateInput {
  id: ID! @libraryID(kind: "scene_marker")
  title: String
  "The start time of the marker (in seconds). Supports decimals."
  seconds: Float
  "The end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID @libraryID(kind: "scene")
  primary_tag_id: ID @libraryID(kind: "tag")
  tag_ids: [ID!] @libraryID(kind: "tag")
}

input BulkSceneMarkerUpdateInput {
  ids: [ID!] @libraryID(kind: "scene_marker")
  apply_to_items_matching_filters: Boolean
  find_filter: FindFilterType
  scene_marker_filter_ast: FilterASTInput
  title: String
  primary_tag_id: ID @libraryID(kind: "tag")
  tag_ids: BulkUpdateIds @libraryScope(kind: "tag")
}

type FindSceneMarkersResultType {
  count: Int!
  scene_markers: [SceneMarker!]!
}

type MarkerStringsResultType {
  count: Int!
  id: ID! @libraryID(kind: "scene_marker")
  title: String!
}
