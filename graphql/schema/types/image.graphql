type Image {
  id: ID! @libraryID(kind: "image")
  title: String
  code: String
  # rating expressed as 1-100
  rating100: Int
  url: String @deprecated(reason: "Use urls")
  urls: [String!]!
  date: String
  details: String
  photographer: String
  o_counter: Int
  organized: Boolean!
  created_at: Time!
  updated_at: Time!

  files: [ImageFile!]! @deprecated(reason: "Use visual_files")
  visual_files: [VisualFile!]!
  paths: ImagePathsType! # Resolver
  galleries: [Gallery!]!
  studio: Studio
  tags: [Tag!]!
  performers: [Performer!]!
  custom_fields: Map!
}

type ImageFileType {
  mod_time: Time!
  size: Int!
  width: Int!
  height: Int!
}

type ImagePathsType {
  thumbnail: String # Resolver
  preview: String # Resolver
  image: String # Resolver
}

input ImageUpdateInput {
  clientMutationId: String
  id: ID! @libraryID(kind: "image")
  title: String
  code: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  date: String
  details: String
  photographer: String

  studio_id: ID @libraryID(kind: "studio")
  performer_ids: [ID!] @libraryID(kind: "performer")
  tag_ids: [ID!] @libraryID(kind: "tag")
  gallery_ids: [ID!] @libraryID(kind: "gallery")

  primary_file_id: ID @libraryID(kind: "file")
  custom_fields: CustomFieldsInput
}

input BulkImageUpdateInput {
  clientMutationId: String
  ids: [ID!] @libraryID(kind: "image")
  apply_to_items_matching_filters: Boolean
  find_filter: FindFilterType
  image_filter_ast: FilterASTInput
  title: String
  code: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  url: String @deprecated(reason: "Use urls")
  urls: BulkUpdateStrings
  date: String
  details: String
  photographer: String

  studio_id: ID @libraryID(kind: "studio")
  performer_ids: BulkUpdateIds @libraryScope(kind: "performer")
  tag_ids: BulkUpdateIds @libraryScope(kind: "tag")
  gallery_ids: BulkUpdateIds @libraryScope(kind: "gallery")
  custom_fields: CustomFieldsInput
}

"""
Set each image's date to the mtime of its primary file. Mirrors the dual-mode
contract of BulkImageUpdateInput: pass an explicit `ids` list, or set
`apply_to_items_matching_filters: true` and supply `find_filter` /
`image_filter_ast` to operate on every match.
"""
input ImagesSetDateFromFileMTimeInput {
  clientMutationId: String
  ids: [ID!] @libraryID(kind: "file")
  apply_to_items_matching_filters: Boolean
  find_filter: FindFilterType
  image_filter_ast: FilterASTInput
}

input ImageDestroyInput {
  id: ID! @libraryID(kind: "image")
  delete_file: Boolean
  delete_generated: Boolean
  "If true, delete the file entry from the database if the file is not assigned to any other objects"
  destroy_file_entry: Boolean
}

input ImagesDestroyInput {
  ids: [ID!]! @libraryID(kind: "image")
  delete_file: Boolean
  delete_generated: Boolean
  "If true, delete the file entry from the database if the file is not assigned to any other objects"
  destroy_file_entry: Boolean
}

"Direction of an in-place EXIF orientation rotation."
enum ImageRotateDirection {
  "Rotate the displayed image 90° clockwise."
  CW
  "Rotate the displayed image 90° counter-clockwise."
  CCW
  "Flip the displayed image upside-down (180°)."
  FLIP
}

input ImageRotateInput {
  id: ID! @libraryID(kind: "image")
  direction: ImageRotateDirection!
}

type FindImagesResultType {
  count: Int!
  "Total megapixels of the images"
  megapixels: Float!
  "Total file size in bytes"
  filesize: Float!
  images: [Image!]!
}

type FindDuplicateImagesResultType {
  count: Int!
  groups: [[Image!]!]!
}
