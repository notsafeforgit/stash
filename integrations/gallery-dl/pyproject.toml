[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-ingest"
version = "0.1.0"
description = "Durable gallery-dl producer for the native Stash ingestion API"
requires-python = ">=3.12"

[project.optional-dependencies]
gallery = [
  "gallery-dl @ git+https://codeberg.org/mikf/gallery-dl.git@c40eb2a42fbaa1d26a2bb7c96804b7f47d1f73f8",
  "yt-dlp==2026.9.27.232945.dev0",
]

[project.scripts]
stash-ingest = "stash_ingest.cli:main"
stash-ingest-config = "stash_ingest.config_migration:main"
stash-ingest-twitter = "stash_ingest.launchers:twitter_main"
stash-ingest-reddit = "stash_ingest.launchers:reddit_main"
stash-import-backfills = "stash_ingest.backfill_import:main"
stash-ingest-n8n = "stash_ingest.n8n_runner:main"
stash-ingest-n8n-config = "stash_ingest.n8n_migration:main"
stash-import-n8n-receipts = "stash_ingest.n8n_receipt_import:main"
stash-import-scan-journal = "stash_ingest.scan_journal_import:main"
stash-activate-scan-journal = "stash_ingest.scan_activation:main"

[tool.setuptools.packages.find]
where = ["src"]
