[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-host-backup"
version = "0.1.0"
description = "Host-owned S3 publication and restore of native Stash archives"
requires-python = ">=3.12"
dependencies = ["boto3==1.43.90", "awscrt==0.36.0", "stash-native-archive==0.1.0", "stash-ingest==0.1.0"]

[project.scripts]
stash-s3-backup = "s3_log_backup:main"
stash-s3-restore-media = "s3_restore_performer:main"
stash-s3-restore-native = "s3_restore_native:main"
stash-s3-audit = "s3_backup_audit:main"
stash-s3-test-restore = "s3_test_restore:main"
stash-s3-inventory = "worker_inventory:main"

[tool.setuptools]
package-dir = {"" = "host"}
py-modules = ["s3_log_backup", "s3_restore_performer", "s3_restore_native", "s3_backup_audit", "s3_test_restore", "native_backup", "native_store", "native_history", "manifest_limits", "object_receipts", "media_objects", "media_index", "worker_inventory"]
