<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" data-app-theme />
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (_e) {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        const resolved = dark ? "dark" : "light";
        root.classList.toggle("dark", dark);
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        document.querySelector('meta[name="color-scheme"]').content = resolved;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0a0a0a" : "#ffffff";
      })();
    </script>
    <style>
      /* Keep the canvas and fixed body the same color from Safari's first
         sample, before React or the bundled stylesheet can load. */
      html { color-scheme: light dark; background-color: var(--color-background, #ffffff); }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background-color: #0a0a0a; }
      }
      html[data-theme="light"] { background-color: var(--color-background, #ffffff); }
      html[data-theme="dark"] { background-color: var(--color-background, #0a0a0a); }
      body { background-color: inherit; }
    </style>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>Login</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/login-main.tsx"></script>
  </body>
</html>
