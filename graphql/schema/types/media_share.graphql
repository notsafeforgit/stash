"Anonymous shares never grant owner access."
enum ShareEntityKind {
  SCENE
  IMAGE
  GALLERY
}

enum ShareMembership { SNAPSHOT ONGOING }
enum ShareSourceKind { SELECTION FILTER PERFORMER STUDIO TAG }
enum ShareLibraryKind { PERFORMER STUDIO TAG }

input MediaShareFilterInput @libraryScope(from: "kind") {
  kind: ShareEntityKind!
  q: String
  filter_ast: FilterASTInput
}

input MediaShareEntityInput @libraryScope(from: "kind") {
  kind: ShareLibraryKind!
  id: ID! @libraryID(kind: "scope")
}

"Exactly one filter or entity. Rules are copied into the share, never a mutable saved-filter reference."
input MediaShareSourceInput {
  mode: ShareMembership!
  filter: MediaShareFilterInput
  entity: MediaShareEntityInput
  "Required for entity sources; a filter already determines its media type."
  media_types: [ShareEntityKind!]
}

enum MediaShareStatus {
  ACTIVE
  "Revoked or expired shares."
  INACTIVE
}

input MediaShareTargetInput  @libraryScope(from: "kind") {
  kind: ShareEntityKind!
  id: ID! @libraryID(kind: "scope")
}

input MediaShareCreateInput {
  label: String!
  expires_at: Time!
  allow_download: Boolean! = false
  show_metadata: Boolean! = false
  "Explicit selections always have snapshot membership. Mutually exclusive with source."
  targets: [MediaShareTargetInput!]
  source: MediaShareSourceInput
}

input MediaShareUpdateInput {
  id: ID!
  label: String!
  expires_at: Time!
  allow_download: Boolean!
  show_metadata: Boolean!
}

type MediaShareEntry {
  kind: ShareEntityKind!
  "Library UUID; absent when an old frozen share cannot identify its original entity."
  id: ID @libraryID(kind: "any")
  title: String!
  media_count: Int!
}

type MediaShare {
  id: ID!
  "Forwardable URL, available to authenticated management while active. Older hash-only shares require explicit regeneration."
  url: String
  label: String!
  created_at: Time!
  expires_at: Time!
  revoked_at: Time
  allow_download: Boolean!
  show_metadata: Boolean!
  access_count: Int!
  last_accessed_at: Time
  items: [MediaShareEntry!]!
  "Frozen media count; ongoing shares have no fixed count."
  media_count: Int
  mode: ShareMembership!
  source_kind: ShareSourceKind!
  source_name: String!
  media_types: [ShareEntityKind!]!
  selection_count: Int!
}

type MediaShareCreated {
  share: MediaShare!
  "Forwardable URL; it can also be retrieved later from the share."
  url: String!
}

type SharingConfiguration {
  "Absolute HTTPS URL ending in /share, or empty to use this application's URL."
  public_url: String!
  max_items: Int!
  max_days: Int!
}

extend type Query {
  mediaShares(limit: Int! = 100, offset: Int! = 0, status: MediaShareStatus): [MediaShare!]!
  mediaShare(id: ID!): MediaShare
  sharingConfiguration: SharingConfiguration!
}

extend type Mutation {
  mediaShareCreate(input: MediaShareCreateInput!): MediaShareCreated!
  mediaShareUpdate(input: MediaShareUpdateInput!): MediaShare!
  mediaShareRevoke(id: ID!): Boolean!
  "Permanently remove a revoked or expired share and its sessions. Media is kept."
  mediaShareDelete(id: ID!): Boolean!
  "Permanently remove all revoked or expired shares and their sessions, returning the number deleted. Active shares and library media are kept."
  mediaSharesDeleteInactive: Int!
  mediaShareRotate(id: ID!): String!
  configureSharing(public_url: String!): SharingConfiguration!
}
