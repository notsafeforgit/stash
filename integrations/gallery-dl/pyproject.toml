[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-ingest"
version = "0.1.0"
description = "Durable gallery-dl producer for the native Stash ingestion API"
requires-python = ">=3.12"

[project.optional-dependencies]
gallery = [
  "gallery-dl @ git+https://github.com/mikf/gallery-dl.git@c40eb2a42fbaa1d26a2bb7c96804b7f47d1f73f8",
  "yt-dlp==2026.9.27.232945.dev0",
]

[project.scripts]
stash-ingest = "stash_ingest.cli:main"
stash-ingest-config = "stash_ingest.config_migration:main"
stash-ingest-twitter = "stash_ingest.launchers:twitter_main"
stash-ingest-reddit = "stash_ingest.launchers:reddit_main"
stash-ingest-instagram = "stash_ingest.launchers:instagram_main"
stash-ingest-coomer = "stash_ingest.launchers:coomer_main"
stash-ingest-kemono = "stash_ingest.launchers:kemono_main"
stash-ingest-bluesky = "stash_ingest.launchers:bluesky_main"
stash-ingest-tiktok = "stash_ingest.launchers:tiktok_main"
stash-import-backfills = "stash_ingest.backfill_import:main"
stash-ingest-n8n = "stash_ingest.n8n_runner:main"
stash-ingest-n8n-config = "stash_ingest.n8n_migration:main"
stash-import-n8n-receipts = "stash_ingest.n8n_receipt_import:main"
stash-import-scan-journal = "stash_ingest.scan_journal_import:main"
stash-activate-scan-journal = "stash_ingest.scan_activation:main"
stash-import-catalog-identities = "stash_ingest.catalog_identity_import:main"
stash-import-catalog-registry = "stash_ingest.catalog_registry_import:main"
stash-prepare-catalog = "stash_ingest.catalog_snapshot:main"
stash-prepare-automation = "stash_ingest.automation_snapshot:main"
stash-upload-automation = "stash_ingest.automation_upload:main"
stash-import-automation-translations = "stash_ingest.automation_translation_import:main"
stash-activate-automation-translations = "stash_ingest.translation_activation:main"
stash-upload-catalog = "stash_ingest.catalog_upload:main"
stash-import-catalog-evidence = "stash_ingest.catalog_evidence_import:main"
stash-import-catalog-relations = "stash_ingest.catalog_relations_import:main"
stash-import-catalog-publishers = "stash_ingest.catalog_publisher_import:main"
stash-import-catalog-attachments = "stash_ingest.catalog_attachment_import:main"
stash-import-catalog-media = "stash_ingest.catalog_media_import:main"
stash-import-catalog-file-history = "stash_ingest.catalog_file_history_import:main"
stash-import-catalog-memberships = "stash_ingest.catalog_membership_import:main"
stash-import-catalog-translations = "stash_ingest.catalog_translation_import:main"
stash-activate-automation-enrichment = "stash_ingest.enrichment_activation:main"
stash-import-automation-enrichment = "stash_ingest.automation_enrichment_import:main"
stash-import-automation-discovery = "stash_ingest.automation_discovery_import:main"
stash-activate-automation-discovery = "stash_ingest.discovery_activation:main"
stash-import-enrichment-checkpoints = "stash_ingest.automation_checkpoint_import:main"
stash-import-catalog-enrichment = "stash_ingest.catalog_enrichment_import:main"
stash-import-catalog-cleanup = "stash_ingest.catalog_cleanup_import:main"
stash-import-catalog-documents = "stash_ingest.catalog_document_import:main"
stash-backfill-source-albums = "stash_ingest.album_backfill:main"

[tool.setuptools.packages.find]
where = ["src"]
