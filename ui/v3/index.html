<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="%COLOR%" />
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json" />
    <title>Stash</title>
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (_e) {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        const resolved = dark ? "dark" : "light";
        root.classList.toggle("dark", dark);
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        document.querySelector('meta[name="color-scheme"]').content = resolved;
      })();
    </script>
    <style>
      /* Safari can retain the first color sampled from our fixed body.
         Resolve both surfaces before the app or custom styles load, as in
         the share, login and offline documents. */
      html { color-scheme: light dark; background-color: var(--color-background, #ffffff); }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background-color: #0a0a0a; }
      }
      html[data-theme="light"] { background-color: var(--color-background, #ffffff); }
      html[data-theme="dark"] { background-color: var(--color-background, #0a0a0a); }
      body { background-color: inherit; }
    </style>
    <link rel="stylesheet" href="css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="javascript"></script>
  </body>
</html>
