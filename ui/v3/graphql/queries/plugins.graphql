query Plugins {
  plugins: pluginsV3 {
    id
    api_version
    name
    enabled
    description
    url
    version

    tasks {
      name
      description
    }

    hooks {
      name
      description
      hooks
    }

    settings {
      name
      display_name
      description
      type
      default_value
      editor
      mapping_targets {
        name
        label
        type
        description
      }
      preview {
        entity
        description
      }
      options {
        value
        label
      }
    }

    requires

    paths {
      entry
    }
  }
}

query PluginLoadErrors {
  pluginLoadErrorsV3 {
    path
    message
  }
}

query PluginTasks {
  pluginTasks: pluginTasksV3 {
    name
    description
    plugin {
      id
      name
      enabled
    }
  }
}

query InstalledPluginPackages {
  installedPackages(type: Plugin) {
    ...PackageData
  }
}

query InstalledPluginPackagesStatus {
  installedPackages(type: Plugin) {
    ...PackageData
    source_package {
      ...PackageData
    }
  }
}

query AvailablePluginPackages($source: String!) {
  availablePackages(source: $source, type: Plugin) {
    ...PackageData
    requires {
      package_id
    }
  }
}

query PluginHookOrder {
  pluginHookOrder {
    hook
    plugin_ids
  }
}
