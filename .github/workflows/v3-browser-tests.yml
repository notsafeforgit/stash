name: v3 browser tests

on:
  push:
    branches: [develop]
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  pull_request:
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    # Pin browsers and their system media libraries together, matching local
    # reproduction. Update this image alongside @playwright/test in ui/v3.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute@sha256:dcf385f7a31aa1cbb0a7a0c97a539142bf70480b661f89f26a774ec1fe2edd1d
      options: --ipc=host
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
        include:
          - browser: chromium
            shards: 4
          # Use GStreamer 1.28: Noble's 1.24 media backend can deadlock or
          # crash during HLS EOF seeks, including with a bare video element.
          - browser: webkit
            shards: 4
          # WebKit uses one worker per shard so media timing checks do not
          # compete on a runner. Chromium retains two workers per shard.
    defaults:
      run:
        shell: bash
        working-directory: ui/v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:browser:shard ${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }}
        # Interleave adjacent cases across all four shards for each engine.
        # Every discovered test belongs to exactly one shard.
        timeout-minutes: 35
        env:
          # Retain native browser exits/stderr when a media process crashes.
          DEBUG: pw:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: v3-browser-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ui/v3/playwright-report/
            ui/v3/test-results/
            ui/v3/dist/browser/
          retention-days: 7
