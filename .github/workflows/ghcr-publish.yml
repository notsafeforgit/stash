name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - develop
      - v3-rewrite
  workflow_dispatch:
    inputs:
      refresh_container_dependencies:
        description: Rebuild container dependencies without cached layers
        type: boolean
        default: false
      preserve_compatible_release:
        description: Preserve the frozen final v2.5-compatible images without rebuilding
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}-ghcr-${{ inputs.preserve_compatible_release && 'preserve-compat' || 'publish' }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !inputs.preserve_compatible_release }}
    uses: ./.github/workflows/native-ci.yml
    permissions:
      contents: read
      actions: read

  build-and-push:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download validated Linux binary
      uses: actions/download-artifact@v8
      with:
        name: native-linux-amd64
        path: dist
    - run: chmod +x dist/stash-linux

    - name: Set lower case owner name
      id: repository_owner
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_REF_NAME" = "v3-rewrite" ]; then
          echo "branch=native-preview" >> "$GITHUB_OUTPUT"
        else
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
        fi
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/ghcr/Dockerfile
        push: true
        pull: true
        no-cache: ${{ inputs.refresh_container_dependencies || false }}
        cache-from: type=gha,scope=stash-native-amd64
        cache-to: type=gha,mode=max,scope=stash-native-amd64
        platforms: linux/amd64
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
        tags: |
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}
          ghcr.io/${{ steps.repository_owner.outputs.owner }}/stash:${{ steps.repository_owner.outputs.branch }}-${{ steps.repository_owner.outputs.short_sha }}

  # Preserve develop's downloadable release using the same validated artifacts;
  # the former Build workflow no longer rebuilds this push independently.
  release-develop:
    needs: [validate, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: native-generated
          path: generated
      - name: Prepare downloadable release
        run: |
          chmod +x dist/stash-linux
          (cd generated/ui/v3/build && zip -r ../../../../dist/stash-ui.zip .)
          git describe --tags --exclude latest_develop | tee CHECKSUMS_SHA1
          sha1sum dist/stash-linux dist/stash-ui.zip | sed 's/dist\///g' | tee -a CHECKSUMS_SHA1
          echo "STASH_VERSION=$(git describe --tags --exclude latest_develop)" >> "$GITHUB_ENV"
      - name: Development Release
        uses: marvinpinto/action-automatic-releases@v1.1.2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: latest_develop
          title: '${{ env.STASH_VERSION }}: Latest development build'
          files: |
            dist/stash-linux
            dist/stash-ui.zip
            CHECKSUMS_SHA1

  preserve-compatible-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Install registry copy tool
      run: sudo apt-get update && sudo apt-get install -y skopeo
    - name: Check preservation invariants
      run: python3 -m unittest discover -s scripts -p test_preserve_compatible_images.py
    - name: Authenticate registry tools
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        printf '%s' "$GHCR_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
    - name: Preserve compatible image manifests
      env:
        REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
      run: |
        python3 scripts/preserve_compatible_images.py \
          --manifest docs/releases/v2.5-compatible-final.json \
          --repository ghcr.io/notsafeforgit/stash \
          --receipt compatible-release-receipt.json
    - uses: actions/upload-artifact@v4
      with:
        name: compatible-stash-release-receipt
        path: compatible-release-receipt.json
        if-no-files-found: error

  cleanup-images:
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RETENTION_DAYS: 14

    steps:
    - name: Delete expired branch build tags
      uses: actions/github-script@v8
      with:
        script: |
          const owner = context.repo.owner;
          const packageName = "stash";
          const ownerType = context.payload.repository.owner.type;
          const retentionDays = Number(process.env.RETENTION_DAYS ?? "14");
          const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
          const branchBuildTagPattern = /^(develop|v3-rewrite|native-preview)-[0-9a-f]{7,}$/i;

          const listPackageVersions =
            ownerType === "Organization"
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

          const listPackageVersionParams =
            ownerType === "Organization"
              ? {
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                }
              : {
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                };

          const deletePackageVersion =
            ownerType === "Organization"
              ? (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForOrg({
                    org: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  })
              : (packageVersionId) =>
                  github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: "container",
                    package_name: packageName,
                    package_version_id: packageVersionId,
                  });

          const versions = await github.paginate(
            listPackageVersions,
            listPackageVersionParams
          );

          const versionsToDelete = versions.filter((version) => {
            const tags = version.metadata?.container?.tags ?? [];
            if (tags.length === 0) {
              return false;
            }

            const updatedAt = version.updated_at ?? version.created_at;
            if (!updatedAt) {
              return false;
            }

            const isExpired = Date.parse(updatedAt) < cutoff;
            const hasOnlyBranchBuildTags = tags.every((tag) =>
              branchBuildTagPattern.test(tag)
            );

            return isExpired && hasOnlyBranchBuildTags;
          });

          if (versionsToDelete.length === 0) {
            core.info(
              `No expired branch build ${packageName} image versions found.`
            );
            return;
          }

          for (const version of versionsToDelete) {
            const tags = version.metadata?.container?.tags ?? [];
            core.info(
              `Deleting tagged [${tags.join(", ")}] ${packageName} image version ${version.id}`
            );
            await deletePackageVersion(version.id);
          }

          core.info(
            `Deleted ${versionsToDelete.length} ${packageName} image version(s).`
          );
