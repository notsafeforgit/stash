name: v3 browser tests

on:
  push:
    branches: [v3-rewrite]
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  pull_request:
    paths:
      - "ui/v3/**"
      - "graphql/**"
      - ".github/workflows/v3-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    # Pin browsers and their system media libraries together, matching local
    # reproduction. Update this image alongside @playwright/test in ui/v3.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
      options: --ipc=host
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
        include:
          - browser: chromium
            shards: 4
          # Use GStreamer 1.28: Noble's 1.24 media backend can deadlock or
          # crash during HLS EOF seeks, including with a bare video element.
          - browser: webkit
            shards: 4
          # WebKit uses one worker per shard so media timing checks do not
          # compete on a runner. Chromium retains two workers per shard.
    defaults:
      run:
        shell: bash
        working-directory: ui/v3
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/v3/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/v3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:browser --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        # All four shards run for each engine; no tests are filtered out.
        timeout-minutes: 35
        env:
          # Retain native browser exits/stderr when a media process crashes.
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: v3-browser-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ui/v3/playwright-report/
            ui/v3/test-results/
          retention-days: 7
