query FindRootFoldersForSelect($folder_filter_ast: FilterASTInput!) {
  findFolders(
    filter: { per_page: -1, sort: "path", direction: ASC }
    folder_filter_ast: $folder_filter_ast
  ) {
    count
    folders {
      ...SelectFolderData
    }
  }
}

query FindFoldersForQuery(
  $filter: FindFilterType
  $folder_filter_ast: FilterASTInput
  $ids: [ID!]
) {
  findFolders(
    filter: $filter
    folder_filter_ast: $folder_filter_ast
    ids: $ids
  ) {
    count
    folders {
      ...RecursiveFolderData
    }
  }
}

query FindFolderHierarchyForIDs($ids: [ID!]!) {
  findFolders(ids: $ids) {
    count
    folders {
      ...SelectFolderData

      parent_folders {
        ...SelectFolderData
        # the parent folders will be expanded, so we need the child folders
        sub_folders {
          ...SelectFolderData
          # get zip file so we can filter out zip folders if needed
          zip_file {
            id
          }
        }
      }
    }
  }
}
