enum SortDirectionEnum {
  ASC
  DESC
}

input FindFilterType {
  q: String
  page: Int
  "use per_page = -1 to indicate all results. Defaults to 25."
  per_page: Int
  # TODO - this should be refactored to not use a string
  sort: String
  direction: SortDirectionEnum
}

type SavedFindFilterType {
  q: String
  page: Int
  """
  use per_page = -1 to indicate all results. Defaults to 25.
  """
  per_page: Int
  sort: String
  direction: SortDirectionEnum
}

enum ResolutionEnum {
  "144p"
  VERY_LOW
  "240p"
  LOW
  "360p"
  R360P
  "480p"
  STANDARD
  "540p"
  WEB_HD
  "720p"
  STANDARD_HD
  "1080p"
  FULL_HD
  "1440p"
  QUAD_HD
  "1920p"
  VR_HD @deprecated(reason: "Use 4K instead")
  "4K"
  FOUR_K
  "5K"
  FIVE_K
  "6K"
  SIX_K
  "7K"
  SEVEN_K
  "8K"
  EIGHT_K
  "8K+"
  HUGE
}

input ResolutionCriterionInput {
  value: ResolutionEnum!
  modifier: CriterionModifier!
}

enum OrientationEnum {
  "Landscape"
  LANDSCAPE
  "Portrait"
  PORTRAIT
  "Square"
  SQUARE
}

input OrientationCriterionInput {
  value: [OrientationEnum!]!
}

input DuplicationCriterionInput {
  duplicated: Boolean @deprecated(reason: "Use phash field instead")
  "Currently unimplemented. Intended for phash distance matching."
  distance: Int
  "Filter by phash duplication"
  phash: Boolean
  "Filter by URL duplication"
  url: Boolean
  "Filter by Stash ID duplication"
  stash_id: Boolean
  "Filter by title duplication"
  title: Boolean
}

input FileDuplicationCriterionInput {
  duplicated: Boolean @deprecated(reason: "Use phash field instead")
  "Currently unimplemented. Intended for phash distance matching."
  distance: Int
  "Filter by phash duplication"
  phash: Boolean
}

input StashIDCriterionInput {
  """
  If present, this value is treated as a predicate.
  That is, it will filter based on stash_id with the matching endpoint
  """
  endpoint: String
  stash_id: String
  modifier: CriterionModifier!
}

input StashIDsCriterionInput {
  """
  If present, this value is treated as a predicate.
  That is, it will filter based on stash_ids with the matching endpoint
  """
  endpoint: String
  stash_ids: [String]
  modifier: CriterionModifier!
}

input CustomFieldCriterionInput {
  field: String!
  value: [Any!]
  modifier: CriterionModifier!
  "Match letter case for text values; numeric comparisons are unchanged."
  case_sensitive: Boolean
}













input FingerprintFilterInput {
  type: String!
  value: String!
  "Hamming distance - defaults to 0"
  distance: Int
}

enum CriterionModifier {
  "="
  EQUALS
  "!="
  NOT_EQUALS
  ">"
  GREATER_THAN
  "<"
  LESS_THAN
  "IS NULL"
  IS_NULL
  "IS NOT NULL"
  NOT_NULL
  "INCLUDES ALL"
  INCLUDES_ALL
  INCLUDES
  EXCLUDES
  "MATCHES REGEX"
  MATCHES_REGEX
  "NOT MATCHES REGEX"
  NOT_MATCHES_REGEX
  ">= AND <="
  BETWEEN
  "< OR >"
  NOT_BETWEEN
}

input StringCriterionInput {
  value: String!
  modifier: CriterionModifier!
  "Match letter case. Omit to retain the existing LIKE/regex behavior."
  case_sensitive: Boolean
}

input IntCriterionInput {
  value: Int!
  value2: Int
  modifier: CriterionModifier!
}

"A library identity criterion; values are UUIDs rather than repository keys."
input IDCriterionInput {
  value: ID! @libraryID(kind: "scope")
  value2: ID @libraryID(kind: "scope")
  modifier: CriterionModifier!
}

input HierarchicalCountInput {
  value: Int!
  value2: Int
  modifier: CriterionModifier!
  "Number of descendant levels to include. Negative values include all descendants."
  depth: Int
}

input FloatCriterionInput {
  value: Float!
  value2: Float
  modifier: CriterionModifier!
}

input MultiCriterionInput {
  value: [ID!] @libraryID(kind: "scope")
  modifier: CriterionModifier!
  excludes: [ID!] @libraryID(kind: "scope")
}

input GenderCriterionInput {
  value: GenderEnum
  value_list: [GenderEnum!]
  modifier: CriterionModifier!
}

input CircumcisionCriterionInput {
  value: [CircumcisedEnum!]
  modifier: CriterionModifier!
}

input HierarchicalMultiCriterionInput {
  value: [ID!] @libraryID(kind: "scope")
  modifier: CriterionModifier!
  depth: Int
  excludes: [ID!] @libraryID(kind: "scope")
}

input DateCriterionInput {
  value: String!
  value2: String
  modifier: CriterionModifier!
}

input TimestampCriterionInput {
  value: String!
  value2: String
  modifier: CriterionModifier!
}

input PhashDistanceCriterionInput {
  value: String!
  modifier: CriterionModifier!
  distance: Int
}

enum FilterMode {
  SCENES
  PERFORMERS
  STUDIOS
  GALLERIES
  SCENE_MARKERS
  MOVIES
  GROUPS
  TAGS
  IMAGES
}

enum DuplicateFilterMode {
  ALL
  ANY
}

type SavedFilter {
  id: ID! @libraryID(kind: "saved_filter")
  mode: FilterMode!
  name: String!
  find_filter: SavedFindFilterType
  """
  Canonical criteria representation: a FilterAST node tree
  (`{group: {operator, children}} | {condition: {field, value}}`) as a
  generic map. Condition values use the labeled saved-criterion shape.
  """
  filter_ast: Map
  # generic map for ui options
  ui_options: Map
}

input SaveFilterInput  @libraryScope(from: "mode") {
  "provide ID to overwrite existing filter"
  id: ID @libraryID(kind: "saved_filter")
  mode: FilterMode!
  name: String!
  find_filter: FindFilterType
  "Canonical criteria representation; null or omitted means no criteria"
  filter_ast: FilterASTInput
  # generic map for ui options
  ui_options: Map
}

input DestroyFilterInput {
  id: ID! @libraryID(kind: "saved_filter")
}
