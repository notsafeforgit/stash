[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-ingest"
version = "0.1.0"
description = "Durable gallery-dl producer for the native Stash ingestion API"
requires-python = ">=3.12"

[project.scripts]
stash-ingest = "stash_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
