mutation PerformerCreate($input: PerformerCreateInput!) {
  performerCreate(input: $input) {
    ...PerformerData
  }
}

mutation PerformerUpdate($input: PerformerUpdateInput!) {
  performerUpdate(input: $input) {
    ...PerformerData
  }
}

mutation PerformerUpdateImage($id: ID!, $image: EntityImageInput!) {
  performerUpdate(input: { id: $id, image_input: $image }) {
    id
    image_path
  }
}

mutation BulkPerformerUpdate($input: BulkPerformerUpdateInput!) {
  bulkPerformerUpdate(input: $input) {
    ...PerformerData
  }
}

mutation BulkPerformerUpdateJob($input: BulkPerformerUpdateInput!) {
  bulkPerformerUpdateJob(input: $input)
}

mutation PerformerDestroy($id: ID!) {
  performerDestroy(input: { id: $id })
}

mutation PerformersDestroy($ids: [ID!]!) {
  performersDestroy(ids: $ids)
}

mutation PerformerMerge($input: PerformerMergeInput!) {
  performerMerge(input: $input) {
    id
  }
}
