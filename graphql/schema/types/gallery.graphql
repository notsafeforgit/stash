type GalleryPathsType {
  cover: String!
  preview: String! # Resolver
}

"Gallery type"
type Gallery {
  id: ID! @libraryID(kind: "gallery")
  title: String
  "Other titles retained from overlapping source albums."
  alternate_titles: [String!]!
  code: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]!
  date: String
  details: String
  photographer: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean!
  created_at: Time!
  updated_at: Time!

  files: [GalleryFile!]!
  folder: Folder

  chapters: [GalleryChapter!]!
  scenes: [Scene!]!
  studio: Studio
  image_count: Int!
  tags: [Tag!]!
  performers: [Performer!]!

  cover: GalleryCover

  paths: GalleryPathsType! # Resolver
  custom_fields: Map!
  image(index: Int!): Image!
  "Images and scenes together, in source order where known, then file order."
  media(offset: Int! = 0, limit: Int! = 60): GalleryMediaConnection!
}

type GalleryCover {
  image: Image
  scene: Scene
}

type GalleryMediaConnection {
  items: [GalleryMediaItem!]!
  count: Int!
  signature: String!
  next_offset: Int
}

type GalleryMediaItem {
  image: Image
  scene: Scene
  source_post_uuid: ID
  source_position: Int
}

input GalleryCreateInput {
  title: String!
  code: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  date: String
  details: String
  photographer: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  scene_ids: [ID!] @libraryID(kind: "scene")
  studio_id: ID @libraryID(kind: "studio")
  tag_ids: [ID!] @libraryID(kind: "tag")
  performer_ids: [ID!] @libraryID(kind: "performer")

  custom_fields: Map
}

input GalleryUpdateInput {
  clientMutationId: String
  id: ID! @libraryID(kind: "gallery")
  title: String
  code: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  date: String
  details: String
  photographer: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  scene_ids: [ID!] @libraryID(kind: "scene")
  studio_id: ID @libraryID(kind: "studio")
  tag_ids: [ID!] @libraryID(kind: "tag")
  performer_ids: [ID!] @libraryID(kind: "performer")

  primary_file_id: ID @libraryID(kind: "file")

  custom_fields: CustomFieldsInput
}

input BulkGalleryUpdateInput {
  clientMutationId: String
  ids: [ID!] @libraryID(kind: "gallery")
  apply_to_items_matching_filters: Boolean
  find_filter: FindFilterType
  gallery_filter_ast: FilterASTInput
  code: String
  url: String @deprecated(reason: "Use urls")
  urls: BulkUpdateStrings
  date: String
  details: String
  photographer: String
  # rating expressed as 1-100
  rating100: Int
  organized: Boolean
  scene_ids: BulkUpdateIds @libraryScope(kind: "scene")
  studio_id: ID @libraryID(kind: "studio")
  tag_ids: BulkUpdateIds @libraryScope(kind: "tag")
  performer_ids: BulkUpdateIds @libraryScope(kind: "performer")

  custom_fields: CustomFieldsInput
}

input GalleryDestroyInput {
  ids: [ID!]! @libraryID(kind: "gallery")
  """
  If true, then the zip file will be deleted if the gallery is zip-file-based.
  If gallery is folder-based, then any files not associated with other
  galleries will be deleted, along with the folder, if it is not empty.
  """
  delete_file: Boolean
  delete_generated: Boolean
  "If true, delete the file entry from the database if the file is not assigned to any other objects"
  destroy_file_entry: Boolean
}

type FindGalleriesResultType {
  count: Int!
  galleries: [Gallery!]!
}

input GalleryAddInput {
  gallery_id: ID! @libraryID(kind: "gallery")
  image_ids: [ID!]! @libraryID(kind: "image")
}

input GalleryRemoveInput {
  gallery_id: ID! @libraryID(kind: "gallery")
  image_ids: [ID!]! @libraryID(kind: "image")
}

input GallerySetCoverInput {
  gallery_id: ID! @libraryID(kind: "gallery")
  "Select exactly one existing gallery member."
  image_id: ID @libraryID(kind: "image")
  scene_id: ID @libraryID(kind: "scene")
}

input GalleryResetCoverInput {
  gallery_id: ID! @libraryID(kind: "gallery")
}
