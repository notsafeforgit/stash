enum DefaultFilterAction {
  SET
  CLEAR
  USE_IMPORTED
  KEEP_CURRENT
}

input DefaultFilterInput {
  mode: FilterMode!
  find_filter: FindFilterType
  filter_ast: FilterASTInput
  ui_options: Map
}

input ConfigureDefaultFilterInput {
  "View key, including scoped views such as performer_scenes"
  view: String!
  action: DefaultFilterAction!
  "Required for SET; conflict resolution uses the current server state"
  filter: DefaultFilterInput
  "Required when resolving a migrated conflict; rejects stale review actions"
  expected_revision: Int
}

extend type Mutation {
  "Updates one native default filter or resolves a retained migration conflict"
  configureDefaultFilter(input: ConfigureDefaultFilterInput!): Map!
}
