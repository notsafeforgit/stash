"The query root for this schema"
type Query {
  # Filters
  findSavedFilter(id: ID! @libraryID(kind: "saved_filter")): SavedFilter @libraryScope(kind: "saved_filter")
  findSavedFilters(mode: FilterMode): [SavedFilter!]! @libraryScope(kind: "saved_filter")

  """
  Returns the distinct custom-field names that exist on at least one row of
  the entity type identified by `mode`. Sorted alphabetically. Used to
  populate the field-name picker in the filter UI.
  """
  customFieldNames(mode: FilterMode!): [String!]!

  "Find a file by its id or path"
  findFile(id: ID @libraryID(kind: "file"), path: String): BaseFile! @libraryScope(kind: "file")

  "Queries for Files"
  findFiles(
    file_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "file")
  ): FindFilesResultType! @libraryScope(kind: "file")

  "Find a file by its id or path"
  findFolder(id: ID @libraryID(kind: "folder"), path: String): Folder! @libraryScope(kind: "folder")

  "Queries for Files"
  findFolders(
    folder_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "folder")
  ): FindFoldersResultType! @libraryScope(kind: "folder")

  "Find a scene by ID or Checksum"
  findScene(id: ID @libraryID(kind: "scene"), checksum: String): Scene @libraryScope(kind: "scene")
  findSceneByHash(input: SceneHashInput!): Scene @libraryScope(kind: "scene")

  "A function which queries Scene objects"
  findScenes(
    scene_filter_ast: FilterASTInput
    ids: [ID!] @libraryID(kind: "scene")
    filter: FindFilterType
  ): FindScenesResultType! @libraryScope(kind: "scene")

  findScenesByPathRegex(filter: FindFilterType): FindScenesResultType! @libraryScope(kind: "scene")

  """
  Returns any groups of scenes that are perceptual duplicates within the queried distance
  and the difference between their duration is smaller than durationDiff
  """
  findDuplicateScenes(
    distance: Int
    """
    Max difference in seconds between files in order to be considered for similarity matching.
    Fractional seconds are ok: 0.5 will mean only files that have durations within 0.5 seconds between them will be matched based on PHash distance.
    """
    duration_diff: Float
    scene_filter_ast: FilterASTInput
    filter_mode: DuplicateFilterMode! = ALL
  ): [[Scene!]!]!

  findDuplicateSceneGroups(
    distance: Int
    """
    Max difference in seconds between files in order to be considered for similarity matching.
    Fractional seconds are ok: 0.5 will mean only files that have durations within 0.5 seconds between them will be matched based on PHash distance.
    """
    duration_diff: Float
    scene_filter_ast: FilterASTInput
    filter_mode: DuplicateFilterMode! = ALL
    filter: FindFilterType
  ): FindDuplicateScenesResultType!

  "Find duplicate images"
  findDuplicateImages(
    distance: Int! = 0
    image_filter_ast: FilterASTInput
    filter_mode: DuplicateFilterMode! = ALL
  ): [[Image!]!]!

  findDuplicateImageGroups(
    distance: Int! = 0
    image_filter_ast: FilterASTInput
    filter_mode: DuplicateFilterMode! = ALL
    filter: FindFilterType
  ): FindDuplicateImagesResultType!

  parseSceneFilenames(
    filter: FindFilterType
    config: SceneParserInput!
  ): SceneParserResultType! @libraryScope(kind: "file")

  "A function which queries SceneMarker objects"
  findSceneMarkers(
    scene_marker_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "scene_marker")
  ): FindSceneMarkersResultType! @libraryScope(kind: "scene_marker")

  "Matching markers plus extra scenes with no matching marker, sorted and paginated together."
  findTVMarkerFeed(
    marker_filter_ast: FilterASTInput
    scene_filter: TVSceneFilterInput!
    "Search applies to markers; ordering and pagination apply to the combined feed."
    filter: FindFilterType
  ): TVMarkerFeedResult! @libraryScope(kind: "scene_marker")

  findImage(id: ID @libraryID(kind: "image"), checksum: String): Image @libraryScope(kind: "image")

  "A function which queries Scene objects"
  findImages(
    image_filter_ast: FilterASTInput
    ids: [ID!] @libraryID(kind: "image")
    filter: FindFilterType
  ): FindImagesResultType! @libraryScope(kind: "image")

  "Find a performer by ID"
  findPerformer(id: ID! @libraryID(kind: "performer")): Performer @libraryScope(kind: "performer")
  "A function which queries Performer objects"
  findPerformers(
    performer_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "performer")
  ): FindPerformersResultType! @libraryScope(kind: "performer")

  "Find a studio by ID"
  findStudio(id: ID! @libraryID(kind: "studio")): Studio @libraryScope(kind: "studio")
  "A function which queries Studio objects"
  findStudios(
    studio_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "studio")
  ): FindStudiosResultType! @libraryScope(kind: "studio")

  "Find a group by ID"
  findGroup(id: ID! @libraryID(kind: "group")): Group @libraryScope(kind: "group")
  "A function which queries Group objects"
  findGroups(
    group_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "group")
  ): FindGroupsResultType! @libraryScope(kind: "group")

  findGallery(id: ID! @libraryID(kind: "gallery")): Gallery @libraryScope(kind: "gallery")
  galleryDeletePreview(ids: [ID!]! @libraryID(kind: "gallery")): GalleryDeletePreview! @libraryScope(kind: "gallery")
  findGalleries(
    gallery_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "gallery")
  ): FindGalleriesResultType! @libraryScope(kind: "gallery")

  findTag(id: ID! @libraryID(kind: "tag")): Tag @libraryScope(kind: "tag")
  findTags(
    tag_filter_ast: FilterASTInput
    filter: FindFilterType
    ids: [ID!] @libraryID(kind: "tag")
  ): FindTagsResultType! @libraryScope(kind: "tag")

  "Retrieve random scene markers for the wall"
  markerWall(q: String): [SceneMarker!]!
  "Retrieve random scenes for the wall"
  sceneWall(q: String): [Scene!]! @libraryScope(kind: "scene")

  "Get marker strings"
  markerStrings(q: String, sort: String): [MarkerStringsResultType]!
  "Get stats"
  stats: StatsResultType!
  "Organize scene markers by tag for a given scene ID"
  sceneMarkerTags(scene_id: ID! @libraryID(kind: "scene")): [SceneMarkerTag!]! @libraryScope(kind: "scene_marker")

  logs: [LogEntry!]!

  # Scrapers

  "List available scrapers"
  listScrapers(types: [ScrapeContentType!]!): [Scraper!]!

  "Scrape for a single scene"
  scrapeSingleScene(
    source: ScraperSourceInput!
    input: ScrapeSingleSceneInput!
  ): [ScrapedScene!]!
  "Scrape for multiple scenes"
  scrapeMultiScenes(
    source: ScraperSourceInput!
    input: ScrapeMultiScenesInput!
  ): [[ScrapedScene!]!]!

  "Scrape for a single studio"
  scrapeSingleStudio(
    source: ScraperSourceInput!
    input: ScrapeSingleStudioInput!
  ): [ScrapedStudio!]!

  "Scrape for a single tag"
  scrapeSingleTag(
    source: ScraperSourceInput!
    input: ScrapeSingleTagInput!
  ): [ScrapedTag!]!

  "Scrape for a single performer"
  scrapeSinglePerformer(
    source: ScraperSourceInput!
    input: ScrapeSinglePerformerInput!
  ): [ScrapedPerformer!]!
  "Scrape for multiple performers"
  scrapeMultiPerformers(
    source: ScraperSourceInput!
    input: ScrapeMultiPerformersInput!
  ): [[ScrapedPerformer!]!]!

  "Scrape for a single gallery"
  scrapeSingleGallery(
    source: ScraperSourceInput!
    input: ScrapeSingleGalleryInput!
  ): [ScrapedGallery!]!

  "Scrape for a single group"
  scrapeSingleGroup(
    source: ScraperSourceInput!
    input: ScrapeSingleGroupInput!
  ): [ScrapedGroup!]!

  "Scrape for a single image"
  scrapeSingleImage(
    source: ScraperSourceInput!
    input: ScrapeSingleImageInput!
  ): [ScrapedImage!]!

  "Scrapes content based on a URL"
  scrapeURL(url: String!, ty: ScrapeContentType!): ScrapedContent

  "Scrapes a complete performer record based on a URL"
  scrapePerformerURL(url: String!): ScrapedPerformer @libraryScope(kind: "performer")
  "Scrapes a complete scene record based on a URL"
  scrapeSceneURL(url: String!): ScrapedScene @libraryScope(kind: "scene")
  "Scrapes a complete gallery record based on a URL"
  scrapeGalleryURL(url: String!): ScrapedGallery @libraryScope(kind: "gallery")
  "Scrapes a complete image record based on a URL"
  scrapeImageURL(url: String!): ScrapedImage @libraryScope(kind: "image")
  "Scrapes a complete group record based on a URL"
  scrapeGroupURL(url: String!): ScrapedGroup @libraryScope(kind: "group")

  # Plugins
  "User-configured invocation order for plugins per hook event"
  pluginHookOrder: [PluginHookOrder!]!

  # Packages
  "List installed packages"
  installedPackages(type: PackageType!): [Package!]!
  "List available packages"
  availablePackages(type: PackageType!, source: String!): [Package!]!

  # Config
  "Returns the current, complete configuration"
  configuration: ConfigResult!
  "Returns an array of paths for the given path"
  directory(
    "The directory path to list"
    path: String
    "Desired collation locale. Determines the order of the directory result. eg. 'en-US', 'pt-BR', ..."
    locale: String = "en"
  ): Directory!
  validateStashBoxCredentials(input: StashBoxInput!): StashBoxValidationResult!

  # System status
  systemStatus: SystemStatus!
  serverCapabilities: ServerCapabilities!

  # Job status
  jobQueue: [Job!]
  "Retained job outcomes, newest first. Limit must be 1–100; offset nonnegative."
  jobHistory(limit: Int! = 25, offset: Int! = 0): [Job!]!
  findJob(input: FindJobInput!): Job

  dlnaStatus: DLNAStatus!

  # Version
  version: Version!

  # LatestVersion
  latestversion: LatestVersion!
}

type Mutation {
  setup(input: SetupInput!): Boolean!

  "Migrates the schema to the required version. Returns the job ID"
  migrate(input: MigrateInput!): ID!

  "Downloads and installs ffmpeg and ffprobe binaries into the configuration directory. Returns the job ID."
  downloadFFMpeg: ID!

  sceneCreate(input: SceneCreateInput!): Scene @libraryScope(kind: "scene")
  sceneUpdate(input: SceneUpdateInput!): Scene @libraryScope(kind: "scene")
  sceneMerge(input: SceneMergeInput!): Scene @libraryScope(kind: "scene")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkSceneUpdate(input: BulkSceneUpdateInput!): BulkUpdateResult! @libraryScope(kind: "scene")
  """
  Sets each scene's date to the mtime of its primary file. Returns "sync"
  for an inline run or a job ID when running in the background.
  """
  scenesSetDateFromFileMTime(input: ScenesSetDateFromFileMTimeInput!): String! @libraryScope(kind: "scene")
  sceneDestroy(input: SceneDestroyInput!): Boolean! @libraryScope(kind: "scene")
  scenesDestroy(input: ScenesDestroyInput!): Boolean! @libraryScope(kind: "scene")
  scenesUpdate(input: [SceneUpdateInput!]!): [Scene] @libraryScope(kind: "scene")

  "Increments the o-counter for a scene. Uses the current time if none provided."
  sceneAddO(id: ID! @libraryID(kind: "scene"), times: [Timestamp!]): HistoryMutationResult! @libraryScope(kind: "scene")
  "Decrements the o-counter for a scene, removing the last recorded time if specific time not provided. Returns the new value"
  sceneDeleteO(id: ID! @libraryID(kind: "scene"), times: [Timestamp!]): HistoryMutationResult! @libraryScope(kind: "scene")

  "Resets the o-counter for a scene to 0. Returns the new value"
  sceneResetO(id: ID! @libraryID(kind: "scene")): Int! @libraryScope(kind: "scene")

  "Sets the resume time point (if provided) and adds the provided duration to the scene's play duration"
  sceneSaveActivity(id: ID! @libraryID(kind: "scene"), resume_time: Float, playDuration: Float): Boolean! @libraryScope(kind: "scene")

  "Resets the resume time point and play duration"
  sceneResetActivity(
    id: ID! @libraryID(kind: "scene")
    reset_resume: Boolean
    reset_duration: Boolean
  ): Boolean! @libraryScope(kind: "scene")

  "Increments the play count for the scene. Uses the current time if none provided."
  sceneAddPlay(id: ID! @libraryID(kind: "scene"), times: [Timestamp!]): HistoryMutationResult! @libraryScope(kind: "scene")
  "Decrements the play count for the scene, removing the specific times or the last recorded time if not provided."
  sceneDeletePlay(id: ID! @libraryID(kind: "scene"), times: [Timestamp!]): HistoryMutationResult! @libraryScope(kind: "scene")
  "Resets the play count for a scene to 0. Returns the new play count value."
  sceneResetPlayCount(id: ID! @libraryID(kind: "scene")): Int! @libraryScope(kind: "scene")

  "Generates screenshot at specified time in seconds. Leave empty to generate default screenshot"
  sceneGenerateScreenshot(id: ID! @libraryID(kind: "scene"), at: Float): ID!

  """
  Updates the primary MKV, MP4, M4V, or MOV video-stream rotation metadata
  without re-encoding. Clockwise/counter-clockwise changes compose with the
  existing rotation; CLEAR removes the transform. The scene file is
  re-fingerprinted afterwards.
  """
  sceneVideoRotate(input: SceneVideoRotateInput!): Scene @libraryScope(kind: "scene")

  sceneMarkerCreate(input: SceneMarkerCreateInput!): SceneMarker @libraryScope(kind: "scene_marker")
  sceneMarkerUpdate(input: SceneMarkerUpdateInput!): SceneMarker @libraryScope(kind: "scene_marker")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkSceneMarkerUpdate(input: BulkSceneMarkerUpdateInput!): BulkUpdateResult! @libraryScope(kind: "scene_marker")
  sceneMarkerDestroy(id: ID! @libraryID(kind: "scene_marker")): Boolean! @libraryScope(kind: "scene_marker")
  sceneMarkersDestroy(ids: [ID!]! @libraryID(kind: "scene_marker")): Boolean! @libraryScope(kind: "scene_marker")

  sceneAssignFile(input: AssignSceneFileInput!): Boolean! @libraryScope(kind: "file")

  imageUpdate(input: ImageUpdateInput!): Image @libraryScope(kind: "image")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkImageUpdate(input: BulkImageUpdateInput!): BulkUpdateResult! @libraryScope(kind: "image")
  """
  Sets each image's date to the mtime of its primary file. Returns "sync"
  for an inline run or a job ID when running in the background.
  """
  imagesSetDateFromFileMTime(input: ImagesSetDateFromFileMTimeInput!): String! @libraryScope(kind: "image")
  imageDestroy(input: ImageDestroyInput!): Boolean! @libraryScope(kind: "image")
  imagesDestroy(input: ImagesDestroyInput!): Boolean! @libraryScope(kind: "image")
  imagesUpdate(input: [ImageUpdateInput!]!): [Image] @libraryScope(kind: "image")

  "Increments the o-counter for an image. Returns the new value"
  imageIncrementO(id: ID! @libraryID(kind: "image")): Int! @libraryScope(kind: "image")
  "Decrements the o-counter for an image. Returns the new value"
  imageDecrementO(id: ID! @libraryID(kind: "image")): Int! @libraryScope(kind: "image")
  "Resets the o-counter for a image to 0. Returns the new value"
  imageResetO(id: ID! @libraryID(kind: "image")): Int! @libraryScope(kind: "image")

  """
  Rotates the image in-place by rewriting its EXIF Orientation tag.
  Only supported on images whose primary file is a JPEG with an existing
  EXIF Orientation tag — others return an error. Pixel data is not touched;
  this is a metadata-only update. The file is re-fingerprinted afterwards
  and the database row is updated with the new fingerprints / dimensions.
  """
  imageRotate(input: ImageRotateInput!): Image @libraryScope(kind: "image")

  galleryCreate(input: GalleryCreateInput!): Gallery @libraryScope(kind: "gallery")
  galleryUpdate(input: GalleryUpdateInput!): Gallery @libraryScope(kind: "gallery")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkGalleryUpdate(input: BulkGalleryUpdateInput!): BulkUpdateResult! @libraryScope(kind: "gallery")
  galleryDestroy(input: GalleryDestroyInput!): Boolean! @libraryScope(kind: "gallery")
  galleriesUpdate(input: [GalleryUpdateInput!]!): [Gallery] @libraryScope(kind: "gallery")

  addGalleryImages(input: GalleryAddInput!): Boolean!
  removeGalleryImages(input: GalleryRemoveInput!): Boolean!
  setGalleryCover(input: GallerySetCoverInput!): Boolean!
  resetGalleryCover(input: GalleryResetCoverInput!): Boolean!

  galleryChapterCreate(input: GalleryChapterCreateInput!): GalleryChapter @libraryScope(kind: "gallery_chapter")
  galleryChapterUpdate(input: GalleryChapterUpdateInput!): GalleryChapter @libraryScope(kind: "gallery_chapter")
  galleryChapterDestroy(id: ID! @libraryID(kind: "gallery_chapter")): Boolean! @libraryScope(kind: "gallery_chapter")

  performerCreate(input: PerformerCreateInput!): Performer @libraryScope(kind: "performer")
  performerUpdate(input: PerformerUpdateInput!): Performer @libraryScope(kind: "performer")
  performerDestroy(input: PerformerDestroyInput!): Boolean! @libraryScope(kind: "performer")
  performersDestroy(ids: [ID!]! @libraryID(kind: "performer")): Boolean! @libraryScope(kind: "performer")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkPerformerUpdate(input: BulkPerformerUpdateInput!): BulkUpdateResult! @libraryScope(kind: "performer")
  performerMerge(input: PerformerMergeInput!): Performer! @libraryScope(kind: "performer")

  studioCreate(input: StudioCreateInput!): Studio @libraryScope(kind: "studio")
  studioUpdate(input: StudioUpdateInput!): Studio @libraryScope(kind: "studio")
  studioDestroy(input: StudioDestroyInput!): Boolean! @libraryScope(kind: "studio")
  studiosDestroy(ids: [ID!]! @libraryID(kind: "studio")): Boolean! @libraryScope(kind: "studio")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkStudioUpdate(input: BulkStudioUpdateInput!): BulkUpdateResult! @libraryScope(kind: "studio")

  groupCreate(input: GroupCreateInput!): Group @libraryScope(kind: "group")
  groupUpdate(input: GroupUpdateInput!): Group @libraryScope(kind: "group")
  groupDestroy(input: GroupDestroyInput!): Boolean! @libraryScope(kind: "group")
  groupsDestroy(ids: [ID!]! @libraryID(kind: "group")): Boolean! @libraryScope(kind: "group")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkGroupUpdate(input: BulkGroupUpdateInput!): BulkUpdateResult! @libraryScope(kind: "group")

  addGroupSubGroups(input: GroupSubGroupAddInput!): Boolean!
  removeGroupSubGroups(input: GroupSubGroupRemoveInput!): Boolean!

  "Reorder sub groups within a group. Returns true if successful."
  reorderSubGroups(input: ReorderSubGroupsInput!): Boolean!

  tagCreate(input: TagCreateInput!): Tag @libraryScope(kind: "tag")
  tagUpdate(input: TagUpdateInput!): Tag @libraryScope(kind: "tag")
  tagDestroy(input: TagDestroyInput!): Boolean! @libraryScope(kind: "tag")
  tagsDestroy(ids: [ID!]! @libraryID(kind: "tag")): Boolean! @libraryScope(kind: "tag")
  tagsMerge(input: TagsMergeInput!): Tag @libraryScope(kind: "tag")
  "Updates explicit IDs atomically or queues a filter selection; reports completion separately from admission."
  bulkTagUpdate(input: BulkTagUpdateInput!): BulkUpdateResult! @libraryScope(kind: "tag")

  """
  Moves the given files to the given destination. Returns true if successful.
  Either the destination_folder or destination_folder_id must be provided.
  If both are provided, the destination_folder_id takes precedence.
  Destination folder must be a subfolder of one of the stash library paths.
  If provided, destination_basename must be a valid filename with an extension that
  matches one of the media extensions.
  Creates folder hierarchy if needed.
  """
  moveFiles(input: MoveFilesInput!): Boolean! @libraryScope(kind: "file")
  deleteFiles(ids: [ID!]! @libraryID(kind: "file")): Boolean! @libraryScope(kind: "file")
  "Deletes file entries from the database without deleting the files from the filesystem"
  destroyFiles(ids: [ID!]! @libraryID(kind: "file")): Boolean! @libraryScope(kind: "file")

  fileSetFingerprints(input: FileSetFingerprintsInput!): Boolean! @libraryScope(kind: "file")
  "Reveal the file in the system file manager"
  revealFileInFileManager(id: ID! @libraryID(kind: "file")): Boolean! @libraryScope(kind: "file")
  "Reveal the folder in the system file manager"
  revealFolderInFileManager(id: ID! @libraryID(kind: "folder")): Boolean! @libraryScope(kind: "folder")

  # Saved filters
  saveFilter(input: SaveFilterInput!): SavedFilter! @libraryScope(kind: "saved_filter")
  destroySavedFilter(input: DestroyFilterInput!): Boolean! @libraryScope(kind: "saved_filter")

  "Change general configuration options"
  configureGeneral(input: ConfigGeneralInput!): ConfigGeneralResult!
  configureInterface(input: ConfigInterfaceInput!): ConfigInterfaceResult!
  configureDLNA(input: ConfigDLNAInput!): ConfigDLNAResult!
  configureScraping(input: ConfigScrapingInput!): ConfigScrapingResult!
  configureDefaults(
    input: ConfigDefaultSettingsInput!
  ): ConfigDefaultSettingsResult!

  "overwrites the entire plugin configuration for the given plugin"
  configurePlugin(plugin_id: ID!, input: Map!): Map!

  """
  overwrites the UI configuration
  if input is provided, then the entire UI configuration is replaced
  if partial is provided, then the partial UI configuration is merged into the existing UI configuration
  """
  configureUI(input: Map, partial: Map): Map!
  """
  sets a single UI key value
  key is a dot separated path to the value
  """
  configureUISetting(key: String!, value: Any): Map!

  "Generate and set (or clear) API key"
  generateAPIKey(input: GenerateAPIKeyInput!): String!

  "Returns a link to download the result"
  exportObjects(input: ExportObjectsInput!): String

  "Performs an incremental import. Returns the job ID"
  importObjects(input: ImportObjectsInput!): ID!

  "Start an full import. Completely wipes the database and imports from the metadata directory. Returns the job ID"
  metadataImport: ID!
  "Start a full export. Outputs to the metadata directory. Returns the job ID"
  metadataExport: ID!
  "Start a scan. Returns the job ID"
  metadataScan(input: ScanMetadataInput!): ID!
  "Start generating content. Returns the job ID"
  metadataGenerate(input: GenerateMetadataInput!): ID!
  "Start auto-tagging. Returns the job ID"
  metadataAutoTag(input: AutoTagMetadataInput!): ID!
  "Clean metadata. Returns the job ID"
  metadataClean(input: CleanMetadataInput!): ID!
  "Clean generated files. Returns the job ID"
  metadataCleanGenerated(input: CleanGeneratedInput!): ID!
  "Identifies scenes using scrapers. Returns the job ID"
  metadataIdentify(input: IdentifyMetadataInput!): ID!

  "Migrate generated files for the current hash naming"
  migrateHashNaming: ID!
  "Migrates legacy scene screenshot files into the blob storage"
  migrateSceneScreenshots(input: MigrateSceneScreenshotsInput!): ID!
  "Migrates blobs from the old storage system to the current one"
  migrateBlobs(input: MigrateBlobsInput!): ID!

  "Anonymise the database in a separate file. Optionally returns a link to download the database file"
  anonymiseDatabase(input: AnonymiseDatabaseInput!): String

  "Optimises the database. Returns the job ID"
  optimiseDatabase: ID!

  "Reload scrapers"
  reloadScrapers: Boolean!

  """
  Enable/disable plugins - enabledMap is a map of plugin IDs to enabled booleans.
  Plugins not in the map are not affected.
  """
  setPluginsEnabled(enabledMap: BoolMap!): Boolean!

  """
  Replace the configured plugin invocation order for a single hook event.
  Pass an empty plugin_ids list to clear the override and fall back to
  alphabetic dispatch. Returns the full updated hook order map.
  Configured IDs that no longer resolve to a loaded plugin are silently
  skipped at dispatch time.
  """
  setPluginHookOrder(input: PluginHookOrderInput!): [PluginHookOrder!]!

  """
  Run a plugin task.
  If task_name is provided, then the task must exist in the plugin config and the tasks configuration
  will be used to run the plugin.
  If no task_name is provided, then the plugin will be executed with the arguments provided only.
  Returns the job ID
  """
  runPluginTask(
    plugin_id: ID!
    "if provided, then the default args will be applied"
    task_name: String
    "displayed in the task queue"
    description: String
    args: [PluginArgInput!] @deprecated(reason: "Use args_map instead")
    args_map: Map
  ): ID!

  """
  Runs a plugin operation. The operation is run immediately and does not use the job queue.
  Returns a map of the result.
  """
  runPluginOperation(plugin_id: ID!, args: Map): Any

  reloadPlugins: Boolean!

  """
  Installs the given packages.
  If a package is already installed, it will be updated if needed..
  If an error occurs when installing a package, the job will continue to install the remaining packages.
  Returns the job ID
  """
  installPackages(type: PackageType!, packages: [PackageSpecInput!]!): ID!
  """
  Updates the given packages.
  If a package is not installed, it will not be installed.
  If a package does not need to be updated, it will not be updated.
  If no packages are provided, all packages of the given type will be updated.
  If an error occurs when updating a package, the job will continue to update the remaining packages.
  Returns the job ID.
  """
  updatePackages(type: PackageType!, packages: [PackageSpecInput!]): ID!
  """
  Uninstalls the given packages.
  If an error occurs when uninstalling a package, the job will continue to uninstall the remaining packages.
  Returns the job ID
  """
  uninstallPackages(type: PackageType!, packages: [PackageSpecInput!]!): ID!

  stopJob(job_id: ID!): Boolean!
  stopAllJobs: Boolean!

  "Submit fingerprints to stash-box instance"
  submitStashBoxFingerprints(
    input: StashBoxFingerprintSubmissionInput!
  ): Boolean!

  "Submit scene as draft to stash-box instance"
  submitStashBoxSceneDraft(input: StashBoxDraftSubmissionInput!): ID @libraryScope(kind: "scene")
  "Submit performer as draft to stash-box instance"
  submitStashBoxPerformerDraft(input: StashBoxDraftSubmissionInput!): ID @libraryScope(kind: "performer")

  "Backup the database. Optionally returns a link to download the database file"
  backupDatabase(input: BackupDatabaseInput!): String

  "DANGEROUS: Execute an arbitrary SQL statement that returns rows."
  querySQL(sql: String!, args: [Any]): SQLQueryResult!

  "DANGEROUS: Execute an arbitrary SQL statement without returning any rows."
  execSQL(sql: String!, args: [Any]): SQLExecResult!

  "Run batch performer tag task. Returns the job ID."
  stashBoxBatchPerformerTag(input: StashBoxBatchTagInput!): String! @libraryScope(kind: "performer")
  "Run batch studio tag task. Returns the job ID."
  stashBoxBatchStudioTag(input: StashBoxBatchTagInput!): String! @libraryScope(kind: "studio")
  "Run batch tag tag task. Returns the job ID."
  stashBoxBatchTagTag(input: StashBoxBatchTagInput!): String! @libraryScope(kind: "tag")

  "Enables DLNA for an optional duration. Has no effect if DLNA is enabled by default"
  enableDLNA(input: EnableDLNAInput!): Boolean!
  "Disables DLNA for an optional duration. Has no effect if DLNA is disabled by default"
  disableDLNA(input: DisableDLNAInput!): Boolean!
  "Enables an IP address for DLNA for an optional duration"
  addTempDLNAIP(input: AddTempDLNAIPInput!): Boolean!
  "Removes an IP address from the temporary DLNA whitelist"
  removeTempDLNAIP(input: RemoveTempDLNAIPInput!): Boolean!
}

type Subscription {
  """
  Job lifecycle events only — ADD (queued) and REMOVE (finished /
  cancelled / failed). Delivered through a dedicated server-side pipeline
  with a separate buffer so progress cannot crowd out lifecycle events.
  Disconnected or slow consumers must reconcile against jobQueue/findJob.
  """
  jobsLifecycleSubscribe: JobStatusUpdate!

  """
  Job progress events only — UPDATE (status / progress / subtasks /
  error). Lossy under backpressure by design: each UPDATE supersedes the
  prior one, so the server prefers dropping an outdated tick over
  blocking new lifecycle events behind it.
  """
  jobsProgressSubscribe: JobStatusUpdate!

  loggingSubscribe: [LogEntry!]!

  scanCompleteSubscribe: Boolean!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
