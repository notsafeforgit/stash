type GalleryChapter {
  id: ID! @libraryID(kind: "gallery_chapter")
  gallery: Gallery!
  title: String!
  image_index: Int!
  created_at: Time!
  updated_at: Time!
}

input GalleryChapterCreateInput {
  gallery_id: ID! @libraryID(kind: "gallery")
  title: String!
  image_index: Int!
}

input GalleryChapterUpdateInput {
  id: ID! @libraryID(kind: "gallery_chapter")
  gallery_id: ID @libraryID(kind: "gallery")
  title: String
  image_index: Int
}

type FindGalleryChaptersResultType {
  count: Int!
  chapters: [GalleryChapter!]!
}
