fragment MediaShareFields on MediaShare {
  id
  url
  label
  created_at
  expires_at
  revoked_at
  allow_download
  show_metadata
  access_count
  last_accessed_at
  media_count
  mode
  source_kind
  source_name
  media_types
  selection_count
}
query MediaShares($limit: Int!, $offset: Int!, $status: MediaShareStatus) {
  mediaShares(limit: $limit, offset: $offset, status: $status) {
    ...MediaShareFields
  }
  sharingConfiguration {
    public_url
    max_items
    max_days
  }
}
mutation MediaShareCreate($input: MediaShareCreateInput!) {
  mediaShareCreate(input: $input) {
    share {
      ...MediaShareFields
    }
    url
  }
}
mutation MediaShareUpdate($input: MediaShareUpdateInput!) {
  mediaShareUpdate(input: $input) {
    ...MediaShareFields
  }
}
mutation MediaShareRevoke($id: ID!) {
  mediaShareRevoke(id: $id)
}
mutation MediaShareDelete($id: ID!) {
  mediaShareDelete(id: $id)
}
mutation MediaSharesDeleteInactive {
  mediaSharesDeleteInactive
}
mutation MediaShareRotate($id: ID!) {
  mediaShareRotate(id: $id)
}
mutation ConfigureSharing($public_url: String!) {
  configureSharing(public_url: $public_url) {
    public_url
    max_items
    max_days
  }
}
