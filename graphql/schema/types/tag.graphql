type Tag {
  id: ID! @libraryID(kind: "tag")
  name: String!
  "Value that does not appear in the UI but overrides name for sorting"
  sort_name: String
  description: String
  aliases: [String!]!
  ignore_auto_tag: Boolean!
  created_at: Time!
  updated_at: Time!
  favorite: Boolean!
  stash_ids: [StashID!]!
  image_path: String # Resolver
  scene_count(depth: Int): Int! # Resolver
  scene_marker_count(depth: Int): Int! # Resolver
  image_count(depth: Int): Int! # Resolver
  gallery_count(depth: Int): Int! # Resolver
  performer_count(depth: Int): Int! # Resolver
  studio_count(depth: Int): Int! # Resolver
  group_count(depth: Int): Int! # Resolver
  parents: [Tag!]!
  children: [Tag!]!

  parent_count: Int! # Resolver
  child_count: Int! # Resolver
  custom_fields: Map!
}

input TagCreateInput {
  provider_metadata: [ProviderMetadataSelectionInput!]
  name: String!
  "Value that does not appear in the UI but overrides name for sorting"
  sort_name: String
  description: String
  "Duplicate aliases and those equal to name will be ignored (case-insensitive)"
  aliases: [String!]
  ignore_auto_tag: Boolean
  favorite: Boolean
  "This should be a URL or a base64 encoded data URL"
  image: String
  "Normalized entity image input. Rejects HEIC/HEIF and stores as WebP."
  image_input: EntityImageInput
  stash_ids: [StashIDInput!]

  parent_ids: [ID!] @libraryID(kind: "tag")
  child_ids: [ID!] @libraryID(kind: "tag")

  custom_fields: Map
}

input TagUpdateInput {
  provider_metadata: [ProviderMetadataSelectionInput!]
  id: ID! @libraryID(kind: "tag")
  name: String
  "Value that does not appear in the UI but overrides name for sorting"
  sort_name: String
  description: String
  "Duplicate aliases and those equal to name will be ignored (case-insensitive)"
  aliases: [String!]
  ignore_auto_tag: Boolean
  favorite: Boolean
  "This should be a URL or a base64 encoded data URL"
  image: String
  "Normalized entity image input. Rejects HEIC/HEIF and stores as WebP."
  image_input: EntityImageInput
  stash_ids: [StashIDInput!]

  parent_ids: [ID!] @libraryID(kind: "tag")
  child_ids: [ID!] @libraryID(kind: "tag")

  custom_fields: CustomFieldsInput
}

input TagDestroyInput {
  id: ID! @libraryID(kind: "tag")
}

type FindTagsResultType {
  count: Int!
  tags: [Tag!]!
}

input TagsMergeInput {
  source: [ID!]! @libraryID(kind: "tag")
  destination: ID! @libraryID(kind: "tag")
  # values defined here will override values in the destination
  values: TagUpdateInput
}

input BulkTagUpdateInput {
  ids: [ID!] @libraryID(kind: "tag")
  apply_to_items_matching_filters: Boolean
  find_filter: FindFilterType
  tag_filter_ast: FilterASTInput
  description: String
  "Duplicate aliases and those equal to name will result in an error (case-insensitive)"
  aliases: BulkUpdateStrings
  ignore_auto_tag: Boolean
  favorite: Boolean

  parent_ids: BulkUpdateIds @libraryScope(kind: "tag")
  child_ids: BulkUpdateIds @libraryScope(kind: "tag")
  custom_fields: CustomFieldsInput
}
