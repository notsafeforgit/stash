fragment FolderData on Folder {
  id
  basename
  path
}

fragment VideoFileData on VideoFile {
  id
  path
  size
  mod_time
  duration
  video_stream_duration
  video_codec
  audio_codec
  frame_count
  duration_mismatch
  width
  height
  bit_depth
  color_range
  color_space
  color_transfer
  color_primaries
  frame_rate
  bit_rate
  fingerprints {
    type
    value
  }
}

fragment ImageFileData on ImageFile {
  id
  path
  size
  mod_time
  width
  height
  bit_depth
  color_range
  color_space
  color_transfer
  color_primaries
  fingerprints {
    type
    value
  }
}

fragment GalleryFileData on GalleryFile {
  id
  path
  size
  mod_time
  fingerprints {
    type
    value
  }
}

fragment VisualFileData on VisualFile {
  ... on BaseFile {
    id
    path
    size
    mod_time
    fingerprints {
      type
      value
    }
  }
  ... on ImageFile {
    id
    path
    size
    mod_time
    width
    height
    bit_depth
    color_range
    color_space
    color_transfer
    color_primaries
    fingerprints {
      type
      value
    }
  }
  ... on VideoFile {
    id
    path
    size
    mod_time
    duration
    video_codec
    audio_codec
    width
    height
    bit_depth
    color_range
    color_space
    color_transfer
    color_primaries
    frame_rate
    bit_rate
    fingerprints {
      type
      value
    }
  }
}

fragment SelectFolderData on Folder {
  id
  path
  basename
}

fragment RecursiveFolderData on Folder {
  ...SelectFolderData

  parent_folders {
    ...SelectFolderData
  }
}
